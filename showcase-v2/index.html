<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#020504" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="icon" href="../app-icon.svg" type="image/svg+xml" />
  <title>LC App — Live Casino. Social Experience.</title>
  <style>
    :root {
      --bg: #020504;
      --panel: rgba(9, 17, 15, .74);
      --panel2: rgba(13, 28, 24, .84);
      --line: rgba(205, 255, 236, .12);
      --line2: rgba(205, 255, 236, .26);
      --text: #f7fffb;
      --soft: rgba(247, 255, 251, .78);
      --muted: rgba(247, 255, 251, .52);
      --mint: #96ffd7;
      --teal: #20dac9;
      --emerald: #073d32;
      --red: #ff4d5a;
      --radius: 8px;
      --radius-lg: 18px;
      --bottom-nav-height: 70px;
      --safe-bottom: env(safe-area-inset-bottom);
      --page-bottom-padding: calc(var(--bottom-nav-height) + var(--safe-bottom) + 30px);
      --app-h: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: dark;
    }
    @supports (height: 100svh) { :root { --app-h: 100svh; } }
    * { box-sizing: border-box; letter-spacing: 0; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body {
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 38% 16%, rgba(32,218,201,.2), transparent 34rem),
        radial-gradient(circle at 70% 78%, rgba(150,255,215,.09), transparent 30rem),
        linear-gradient(135deg, #07140f 0%, #020504 58%, #010202 100%);
    }
    button, a { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--mint); outline-offset: 3px; }
    img { display: block; max-width: 100%; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 46px; line-height: .94; }
    h2 { font-size: 27px; line-height: 1.03; }
    h3 { font-size: 16px; line-height: 1.18; }
    p { color: var(--soft); font-size: 13px; line-height: 1.45; }
    .stage {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(480px, .95fr) minmax(420px, .75fr);
      gap: clamp(64px, 7vw, 140px);
      align-items: center;
      width: 100%;
      max-width: 1520px;
      margin: 0 auto;
      padding: clamp(28px, 4vw, 56px);
      position: relative;
      isolation: isolate;
    }
    .stage::before {
      content: "";
      position: fixed;
      inset: 8%;
      background: radial-gradient(circle at 38% 34%, rgba(32,218,201,.22), transparent 28rem);
      filter: blur(28px);
      opacity: .9;
      z-index: -1;
    }
    .phone {
      justify-self: end;
      width: auto;
      height: min(82vh, 900px);
      max-height: calc(100vh - clamp(56px, 8vh, 96px));
      aspect-ratio: 430 / 932;
      padding: 10px;
      border-radius: 34px;
      border: 1px solid rgba(150,255,215,.18);
      background: linear-gradient(145deg, rgba(11,24,20,.96), rgba(2,5,4,.98));
      box-shadow: 0 44px 150px rgba(0,0,0,.56), 0 0 90px rgba(32,218,201,.16), 0 0 0 1px rgba(32,218,201,.07) inset;
    }
    .app {
      position: relative;
      height: 100%;
      overflow: hidden;
      border-radius: 26px;
      border: 1px solid rgba(255,255,255,.08);
      background: linear-gradient(180deg, #07110f 0%, #030605 100%);
    }
    .app::before {
      content: "";
      position: absolute;
      top: 12px;
      left: 50%;
      width: 112px;
      height: 30px;
      border-radius: 999px;
      transform: translateX(-50%);
      background: #020403;
      z-index: 20;
    }
    .screen {
      position: absolute;
      inset: 0;
      display: none;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 58px 16px var(--page-bottom-padding);
      scrollbar-width: none;
      background:
        radial-gradient(circle at 82% 0%, rgba(32,218,201,.1), transparent 18rem),
        linear-gradient(180deg, rgba(4, 14, 12, .98), rgba(2,5,4,1));
    }
    .screen::-webkit-scrollbar { display: none; }
    .screen.active { display: block; animation: enter .2s ease-out; }
    .app[data-route="welcome"] .bottom-nav,
    .app[data-route="industry"] .bottom-nav { display: none; }
    .app[data-route="welcome"] .screen,
    .app[data-route="industry"] .screen { padding-bottom: 30px; }
    @keyframes enter { from { opacity: .45; transform: translateY(7px); } to { opacity: 1; transform: none; } }
    .screen * { min-width: 0; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 18px; }
    .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .logo {
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, var(--mint), var(--teal));
      color: #021210;
      font-weight: 950;
      box-shadow: 0 14px 34px rgba(32,218,201,.22);
    }
    .brand strong { display: block; font-size: 14px; line-height: 1.05; white-space: nowrap; }
    .brand span { display: none; color: var(--muted); font-size: 7.5px; font-weight: 850; text-transform: uppercase; white-space: nowrap; }
    .top-actions { display: flex; align-items: center; gap: 5px; flex: 0 0 auto; }
    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 11px;
      border: 1px solid rgba(255,255,255,.09);
      background: rgba(255,255,255,.045);
      color: var(--soft);
      display: grid;
      place-items: center;
    }
    .avatar-mini { width: 32px; height: 32px; border-radius: 11px; object-fit: cover; border: 1px solid rgba(255,255,255,.12); }
    .label, .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 24px;
      padding: 0 9px;
      border-radius: 999px;
      border: 1px solid var(--line2);
      background: rgba(32,218,201,.1);
      color: var(--mint);
      font-size: 8.5px;
      font-weight: 900;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .label.live, .pill.live { color: #ffd9dd; background: rgba(255,77,90,.14); border-color: rgba(255,77,90,.4); }
    .pill.soft { color: var(--soft); background: rgba(255,255,255,.055); border-color: rgba(255,255,255,.1); }
    .demo-note { color: var(--muted); font-size: 9.5px; line-height: 1.35; }
    .btn {
      min-height: 43px;
      border: 0;
      border-radius: var(--radius);
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 920;
      color: #021210;
      background: linear-gradient(135deg, var(--mint), var(--teal));
      text-decoration: none;
      white-space: nowrap;
    }
    .btn.secondary, .btn.following {
      color: var(--text);
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.055);
      box-shadow: none;
    }
    .btn.following { color: var(--mint); border-color: rgba(150,255,215,.35); background: rgba(7,61,50,.5); }
    .btn.slim { min-height: 34px; padding: 0 11px; font-size: 10.5px; }
    .cta-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .chip {
      min-height: 31px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 999px;
      background: rgba(255,255,255,.045);
      color: var(--soft);
      padding: 0 10px;
      font-size: 10.5px;
      font-weight: 820;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .chip.active, .btn.active { color: var(--mint); border-color: rgba(32,218,201,.45); background: rgba(32,218,201,.12); }
    .icon { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
    .section { display: grid; gap: 12px; margin-top: 22px; }
    .section.subtle { gap: 10px; }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 10px; }
    .section-head span { color: var(--muted); font-size: 9px; font-weight: 850; }
    .card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      overflow: hidden;
      backdrop-filter: blur(18px);
    }
    .pulse { position: relative; }
    .pulse::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--red);
      box-shadow: 0 0 0 rgba(255,77,90,.45);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,77,90,.45); } 70% { box-shadow: 0 0 0 9px rgba(255,77,90,0); } 100% { box-shadow: 0 0 0 0 rgba(255,77,90,0); } }

    .image-frame { position: relative; overflow: hidden; background: #07100e; }
    .image-frame > img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .dealer-avatar { aspect-ratio: 1 / 1; border-radius: 12px; }
    .dealer-portrait { aspect-ratio: 3 / 4; border-radius: var(--radius-lg); }
    .dealer-hero { aspect-ratio: 4 / 5; border-radius: 22px; }
    .dealer-live { aspect-ratio: 16 / 11; border-radius: 22px; }
    .dealer-content { aspect-ratio: 16 / 10; border-radius: var(--radius-lg); }
    .room-hero { aspect-ratio: 16 / 11; border-radius: 22px; }

    .welcome { min-height: 100%; display: grid; align-content: end; gap: 14px; }
    .welcome-visual {
      position: relative;
      height: min(54svh, 480px);
      min-height: 390px;
      border-radius: 22px;
      overflow: hidden;
      background: #07100e;
      box-shadow: inset 0 0 0 1px rgba(150,255,215,.14);
    }
    .welcome-visual img, .hero-live img, .portrait-tile img, .profile-hero img, .room-stage img, .image-post img, .profile-room img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .welcome-visual > img, .hero-live > img, .profile-hero > img, .room-stage > img, .image-post > img, .profile-room > img, .portrait-img img {
      position: absolute;
      inset: 0;
    }
    .welcome-visual img { object-position: center 18%; filter: saturate(1.04) contrast(1.04) brightness(.86); }
    .welcome-visual::after, .hero-live::after, .profile-hero::after, .room-stage::after, .image-post::after, .profile-room::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.02), rgba(2,5,4,.18) 42%, rgba(2,5,4,.83));
    }
    .welcome-copy { display: grid; gap: 9px; }
    .welcome-copy h1 { margin-top: 4px; }
    .welcome-copy p { color: var(--text); font-size: 15px; max-width: 34ch; }
    .text-link { color: var(--muted); border: 0; background: none; padding: 0; font-size: 11px; justify-self: start; }

    .hero-live {
      position: relative;
      aspect-ratio: 16 / 14;
      min-height: 330px;
      border-radius: 22px;
      overflow: hidden;
      background: #07100e;
      box-shadow: inset 0 0 0 1px rgba(150,255,215,.14);
    }
    .hero-live img { object-position: center 30%; filter: saturate(1.06) contrast(1.04) brightness(.82); }
    .hero-content {
      position: absolute;
      inset: auto 13px 13px;
      z-index: 2;
      display: grid;
      justify-items: start;
      gap: 8px;
    }
    .hero-content h2 { font-size: 33px; }
    .creator-strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .creator-strip::-webkit-scrollbar { display: none; }
    .portrait-tile {
      min-width: 98px;
      border: 0;
      color: var(--text);
      background: transparent;
      display: grid;
      gap: 8px;
      text-align: left;
    }
    .portrait-img {
      position: relative;
      aspect-ratio: 3 / 4;
      height: auto;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.1);
      background: #07100e;
    }
    .portrait-img img { object-position: center 22%; filter: saturate(1.04) brightness(.88); }
    .portrait-tile b { display: block; font-size: 13px; }
    .portrait-tile span { display: block; color: var(--muted); font-size: 10px; line-height: 1.28; }
    .content-stack { display: grid; gap: 12px; }
    .image-post {
      position: relative;
      aspect-ratio: 16 / 10;
      min-height: 178px;
      border-radius: 18px;
      overflow: hidden;
      background: #07100e;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
    }
    .image-post img { object-position: center 44%; filter: saturate(1.02) brightness(.76); }
    .post-body {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 2;
      display: grid;
      justify-items: start;
      gap: 7px;
    }
    .post-top { display: flex; align-items: center; gap: 8px; }
    .post-top img { width: 34px; height: 34px; object-fit: cover; border-radius: 11px; border: 1px solid rgba(255,255,255,.12); }
    .activity-row {
      display: grid;
      grid-template-columns: 44px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 12px 0;
      border-top: 1px solid rgba(255,255,255,.08);
    }
    .activity-row:first-child { border-top: 0; }
    .activity-row img { width: 44px; height: 44px; border-radius: 13px; object-fit: cover; }
    .activity-row b { display: block; font-size: 13px; }
    .activity-row span { color: var(--muted); font-size: 11px; }
    .action-icons { display: flex; gap: 6px; align-items: center; }
    .round-action {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.045);
      color: var(--soft);
      display: grid;
      place-items: center;
    }
    .round-action.active { color: var(--mint); border-color: rgba(32,218,201,.46); background: rgba(32,218,201,.12); }

    .profile-hero {
      position: relative;
      aspect-ratio: 16 / 15;
      min-height: 420px;
      border-radius: 22px;
      overflow: hidden;
      background: #07100e;
      box-shadow: 0 24px 60px rgba(0,0,0,.34), inset 0 0 0 1px rgba(150,255,215,.14);
    }
    .profile-hero img { object-position: center 31%; filter: saturate(1.06) contrast(1.04) brightness(.84); }
    .profile-overlay {
      position: absolute;
      inset: auto 14px 14px;
      z-index: 3;
      display: grid;
      justify-items: start;
      gap: 9px;
    }
    .profile-overlay h1 { font-size: 44px; }
    .profile-actions { display: grid; grid-template-columns: 1.35fr 1fr 44px; gap: 8px; align-items: stretch; width: 100%; }
    .profile-actions .icon-btn { width: 44px; height: 43px; border-radius: var(--radius); }
    .profile-tags { display: flex; gap: 8px; flex-wrap: wrap; color: var(--soft); font-size: 12px; }
    .tabbar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 18px;
      padding: 4px;
      border-radius: 12px;
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.08);
    }
    .tab {
      min-height: 34px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
    }
    .tab.active { color: var(--mint); background: rgba(32,218,201,.12); }
    .profile-panel { display: grid; gap: 16px; margin-top: 18px; }
    .profile-summary { display: grid; gap: 8px; }
    .profile-summary b { font-size: 18px; }
    .profile-room {
      position: relative;
      min-height: 200px;
      border-radius: 18px;
      overflow: hidden;
      background: #07100e;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
    }
    .profile-room img { object-position: center 54%; filter: saturate(1.02) brightness(.74); }

    .room-stage {
      position: relative;
      width: 100%;
      min-height: 420px;
      border-radius: 22px;
      overflow: hidden;
      background: #07100e;
      box-shadow: inset 0 0 0 1px rgba(150,255,215,.13);
    }
    .room-stage img { object-position: center 48%; filter: saturate(1.04) contrast(1.04) brightness(.68); }
    .room-overlay {
      position: absolute;
      inset: 16px 13px auto;
      z-index: 3;
      display: grid;
      justify-items: start;
      gap: 8px;
    }
    .room-overlay h2 { font-size: 35px; max-width: 9ch; }
    .room-host {
      border: 0;
      border-radius: 16px;
      color: var(--text);
      background: rgba(3,10,9,.72);
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 10px;
      text-align: left;
      backdrop-filter: blur(14px);
    }
    .room-host img { width: 46px; height: 46px; border-radius: 13px; object-fit: cover; filter: none; }
    .chat-list { display: grid; gap: 2px; border-top: 1px solid rgba(255,255,255,.08); border-bottom: 1px solid rgba(255,255,255,.08); }
    .chat-line {
      display: grid;
      grid-template-columns: 66px 1fr;
      gap: 8px;
      padding: 9px 0;
      align-items: start;
    }
    .chat-line b { color: var(--mint); font-size: 11px; }
    .chat-line span { color: var(--soft); font-size: 12px; line-height: 1.35; }
    .room-sticky {
      margin-top: 16px;
      margin-bottom: 8px;
      padding: 11px;
      border-radius: 18px;
      border: 1px solid rgba(150,255,215,.18);
      background: rgba(3, 10, 9, .86);
      display: grid;
      gap: 9px;
      backdrop-filter: blur(18px);
    }
    .sticky-top { display: flex; justify-content: space-between; gap: 10px; align-items: center; color: var(--muted); font-size: 10px; font-weight: 900; text-transform: uppercase; }
    .sticky-top span:last-child { text-align: right; overflow: hidden; text-overflow: ellipsis; }
    .sticky-actions { display: grid; grid-template-columns: 1fr 38px 38px; gap: 8px; }
    .qualifier { color: var(--muted); font-size: 10px; }

    .following-list { display: grid; gap: 18px; }
    .feed-unit { display: grid; gap: 8px; }
    .feed-unit h3 { font-size: 18px; }
    .feed-unit .activity-row { padding: 9px 0; }
    .feed-label {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 900;
      text-transform: uppercase;
    }
    .feed-label::after {
      content: "";
      height: 1px;
      flex: 1;
      background: rgba(255,255,255,.08);
    }
    .notification-box {
      padding: 13px;
      border-radius: 16px;
      background: rgba(32,218,201,.09);
      border: 1px solid rgba(150,255,215,.16);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .industry-intro h1 { font-size: 40px; }
    .industry-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .flow-grid { display: grid; gap: 12px; }
    .flow-card {
      padding: 15px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.09);
      background: rgba(255,255,255,.045);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.025);
    }
    .flow-card.hypothesis {
      border-color: rgba(150,255,215,.24);
      background: linear-gradient(145deg, rgba(7,61,50,.58), rgba(3,10,9,.82));
    }
    .flow-card > span {
      display: block;
      color: var(--muted);
      font-size: 9px;
      font-weight: 950;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .flow-steps { display: grid; gap: 8px; }
    .flow-step {
      display: grid;
      grid-template-columns: 24px 1fr 16px;
      align-items: center;
      gap: 9px;
      color: var(--text);
      font-size: 13px;
      font-weight: 850;
    }
    .flow-step i {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.07);
      color: var(--muted);
      font-style: normal;
      font-size: 10px;
    }
    .flow-card.hypothesis .flow-step i { background: rgba(150,255,215,.16); color: var(--mint); }
    .flow-step em { color: var(--muted); font-style: normal; font-size: 15px; }
    .flow-step:last-child em { opacity: 0; }
    .value-grid { display: grid; gap: 10px; }
    .value-card { padding: 14px; border-radius: 16px; }
    .value-card p { margin-top: 5px; }
    .core-line {
      padding: 14px;
      border-radius: 16px;
      border: 1px solid rgba(150,255,215,.2);
      background: rgba(32,218,201,.09);
    }
    .role-grid { display: grid; gap: 10px; }
    .role-card {
      padding: 14px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.09);
      background: rgba(255,255,255,.045);
      display: grid;
      gap: 6px;
    }
    .role-card strong {
      color: var(--mint);
      font-size: 10px;
      font-weight: 950;
      text-transform: uppercase;
    }
    .role-card b { font-size: 16px; }

    .side {
      justify-self: start;
      display: grid;
      gap: 16px;
      align-content: center;
      width: 100%;
      max-width: 520px;
      color: var(--soft);
    }
    .side span { color: var(--mint); font-size: 11px; font-weight: 900; text-transform: uppercase; }
    .side h2 { font-size: clamp(42px, 3.9vw, 58px); line-height: 1.02; max-width: 520px; white-space: pre-line; }
    .side p { font-size: clamp(18px, 1.4vw, 22px); line-height: 1.45; max-width: 440px; }

    function go(route) {

    function toggle(list, id) {

      render();

      const alex = dealer("alex");
      const marcus = dealer("marcus");
      $("following").innerHTML = `${topbar()}<div class="section" style="margin-top:0"><h2>Following</h2><div class="following-list"><div class="feed-unit"><span class="feed-label">LIVE NOW</span>${activityRow(sofia, "Sofia is live", "Blackjack Royale", "watch")}</div><div class="feed-unit"><span class="feed-label">STARTING SOON</span>${activityRow(alex, "Alex starts Baccarat", "In 20 min", "save")}</div><div class="feed-unit"><span class="feed-label">FROM SOFIA</span>${imagePost(posts[1])}</div><div class="feed-unit"><span class="feed-label">COMMUNITY</span>${activityRow(marcus, "Blackjack Strategy", "Table pace and player questions", "profile")}</div><div class="notification-box"><div><h3>Sofia is live now</h3><p>Blackjack Royale is open.</p></div><button class="btn slim" type="button" data-go="live">Watch</button></div></div></div>`;
    }
    function industry() {
      $("industry").innerHTML = `<div class="industry-top">${simpleTopbar()}<button class="chip" type="button" data-go="discover">Explore Live</button></div><div class="section industry-intro" style="margin-top:0"><h1>How it works</h1><p>LC App adds the missing social and creator layer to Live Casino.</p><span class="label">CONCEPT VISION — TO BE VALIDATED</span></div><div class="section"><div class="flow-grid"><article class="flow-card"><span>Today</span><div class="flow-steps"><div class="flow-step"><i>1</i><b>Casino</b><em>→</em></div><div class="flow-step"><i>2</i><b>Lobby</b><em>→</em></div><div class="flow-step"><i>3</i><b>Game</b><em>→</em></div><div class="flow-step"><i>4</i><b>Table</b><em>→</em></div></div></article><article class="flow-card hypothesis"><span>With LC App</span><div class="flow-steps"><div class="flow-step"><i>1</i><b>Discover</b><em>→</em></div><div class="flow-step"><i>2</i><b>Dealer</b><em>→</em></div><div class="flow-step"><i>3</i><b>Content</b><em>→</em></div><div class="flow-step"><i>4</i><b>Follow</b><em>→</em></div><div class="flow-step"><i>5</i><b>Live</b><em>→</em></div><div class="flow-step"><i>6</i><b>Play</b><em>→</em></div></div></article></div></div><div class="section"><article class="core-line"><h3>One social layer around Live Casino</h3><p>Players discover people, follow creators and return to live tables through identity and content.</p></article><div class="role-grid"><article class="role-card"><strong>Player</strong><b>Find who you want to play with, not only what you want to play.</b></article><article class="role-card"><strong>Dealer</strong><b>From dealer to creator.</b><p>Profile, followers, content, schedule, audience and return visits.</p></article><article class="role-card"><strong>Operator</strong><b>Turn live casino traffic into relationships and repeat visits.</b><p>Potential acquisition, engagement, retention and attribution layer.</p></article><article class="role-card"><strong>Provider</strong><b>From game distribution to audience distribution.</b><p>Discovery for dealers, games and live tables without replacing provider infrastructure.</p></article></div><span class="demo-note">Illustrative concept demo. No confirmed integrations, partnerships, revenue or validated business outcomes.</span><button class="btn" type="button" data-go="discover">EXPLORE LIVE</button></div>`;
    }
    const screens = { welcome, discover, dealer: dealerProfile, live: liveRoom, following, industry };
    const sideCopy = {
      welcome: ["LIVE CASINO. SOCIAL EXPERIENCE.", "Discover dealers.\nFollow creators.\nJoin live tables.", "A social discovery layer connecting players, dealers, operators and providers."],
      discover: ["LIVE CASINO. SOCIAL EXPERIENCE.", "Discover dealers.\nFollow creators.\nJoin live tables.", "A social discovery layer connecting players, dealers, operators and providers."],
      dealer: ["PROFILE", "Dealer Profile", "Follow. Watch. Return."],
      live: ["LIVE", "Live Room", "Social layer before operator handoff."],
      following: ["FOLLOWING", "Following", "A reason to come back."],
      industry: ["HOW IT WORKS", "Social layer for\nLive Casino", "Players, dealers, operators and providers each get a clear reason to use it."]
    };
    function sheet(type) {
      const content = {
        message: `<div class="sheet-head"><h3>Sofia Laurent</h3><button class="chip" type="button" data-close>Close</button></div><span class="pill soft">Demo conversation</span><div class="chat-list"><div class="chat-line"><b>You</b><span>Are you live tomorrow?</span></div><div class="chat-line"><b>Sofia</b><span>Yes — 20:00. See you at the table.</span></div></div><div class="input-row">Message Sofia...</div>`,
        chat: `<div class="sheet-head"><h3>Chat</h3><button class="chip" type="button" data-close>Close</button></div><p>Add one controlled demo message to the room.</p><button class="btn" type="button" data-comment="See you at 20:00.">Add message</button>`,
        operator: `<div class="sheet-head"><h3>Operator / provider handoff</h3><button class="chip" type="button" data-close>Close</button></div><span class="label">CONCEPT VISION</span><p>LC App does not process gambling transactions. Gambling-account and transaction controls remain outside LC App with the licensed operator/provider.</p><button class="btn" type="button" data-close>External operator step</button>`,
        notify: `<div class="sheet-head"><h3>Notifications</h3><button class="chip" type="button" data-close>Close</button></div><div class="chat-list"><div class="chat-line"><b>Sofia</b><span>is live now.</span></div><div class="chat-line"><b>Alex</b><span>starts in 20 min.</span></div><div class="chat-line"><b>Mia</b><span>replied to your comment.</span></div></div>`,
        search: `<div class="sheet-head"><h3>Search</h3><button class="chip" type="button" data-close>Close</button></div><p>Find dealers, rooms and communities.</p><button class="btn secondary" type="button" data-go="discover">Explore people</button>`
      }[type];
      $("sheet").innerHTML = content || "";
      $("sheet").classList.add("open");
    }
    function closeSheet() { $("sheet").classList.remove("open"); }
    function render() {
      const active = route();
      $("app").dataset.route = active;
      Object.keys(screens).forEach(id => $(id).classList.toggle("active", id === active));
      screens[active]();
      document.querySelectorAll(".nav").forEach(btn => {
        const r = btn.dataset.go;
        btn.classList.toggle("active", r === active);
        btn.innerHTML = `${r === "discover" ? icons.discover : r === "live" ? icons.live : r === "following" ? icons.following : icons.user}<span>${r === "discover" ? "Discover" : r === "live" ? "Live" : r === "following" ? "Following" : "Profile"}</span>`;
      });
      const side = sideCopy[active] || sideCopy.discover;
      const kicker = document.getElementById("side-kicker");
      if (kicker) {
        kicker.textContent = side[0];
        document.getElementById("side-title").textContent = side[1];
        document.getElementById("side-copy").textContent = side[2];
      }
    }
    document.addEventListener("click", (e) => {
      const g = e.target.closest("[data-go]");
      const f = e.target.closest("[data-follow]");
      const l = e.target.closest("[data-like]");
      const s = e.target.closest("[data-save]");
      const p = e.target.closest("[data-profile]");
      const sh = e.target.closest("[data-sheet]");
      const c = e.target.closest("[data-comment]");
      const t = e.target.closest("[data-tab]");
      const close = e.target.closest("[data-close]");
      if (g) go(g.dataset.go);
      if (f) { toggle("followed", f.dataset.follow); toast(state.followed.includes(f.dataset.follow) ? "Following" : "Unfollowed"); }
      if (l) { toggle("liked", l.dataset.like); toast(state.liked.includes(l.dataset.like) ? "Liked" : "Like removed"); }
      if (s) { toggle("saved", s.dataset.save); toast(state.saved.includes(s.dataset.save) ? "Saved" : "Removed from saved"); }
      if (p) go("dealer");
      if (sh) sheet(sh.dataset.sheet);
      if (c) { state.comments.push(c.dataset.comment); persist(); closeSheet(); render(); toast("Message added"); }
      if (t) { state.tab = t.dataset.tab; persist(); render(); }
      if (close) closeSheet();
    });
    window.addEventListener("hashchange", render);
    render();
  </script>
</body>
</html>
