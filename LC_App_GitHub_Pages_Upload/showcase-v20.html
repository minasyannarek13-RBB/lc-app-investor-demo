e{outline:2px solid var(--mint);outline-offset:4px}.hint{position:fixed;left:18px;bottom:19px;z-index:760;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.38);opacity:0;transition:opacity .6s}.hint.show{opacity:1}.hint b{color:var(--mint);font-weight:800}.soundWave{display:flex;gap:2px;align-items:end;height:13px}.soundWave i{display:block;width:2px;background:currentColor;border-radius:2px;height:5px}.soundWave i:nth-child(2){height:10px}.soundWave i:nth-child(3){height:7px}.playing .soundWave i{animation:wave .9s ease-in-out infinite alternate}.playing .soundWave i:nth-child(2){animation-delay:.2s}.playing .soundWave i:nth-child(3){animation-delay:.4s}@keyframes wave{to{height:12px}}@media(max-width:650px){.appButton{width:124px;height:124px}.appButton img{border-radius:28px}.pulse{inset:-18px}.launch h1{font-size:44px}.launch p{font-size:14px;max-width:88%}.controls{right:12px;bottom:12px}.hint{left:12px;bottom:16px;max-width:50vw;line-height:1.45}.suit{font-size:70px}.ghostCard{width:62px;height:92px}}@media(prefers-reduced-motion:reduce){.pulse,.playing .soundWave i{animation:none}.curtain,.curtainSuit,.launch,.controls{transition:none}.motifs{display:none}}</style></head><body><div class="stage"><iframe id="story" src="showcase-v19.html" title="LC product journey"></iframe></div><div class="motifs" aria-hidden="true"><div class="suit s1">♠</div><div class="suit red s2">♥</div><div class="suit s3">♣</div><div class="suit red s4">♦</div><div class="ghostCard c1"></div><div class="ghostCard c2"></div></div><div class="curtain" id="curtain" aria-hidden="true"><div class="curtainSuit" id="curtainSuit">♠</div></div><div class="launch" id="launch"><div class="launchInner"><button class="appButton" id="launchBtn" aria-label="Begin LC journey"><span class="pulse"></span><img src="app-icon.svg" alt="LC App icon"></button><h1>Live Casino <span>through people.</span></h1><p id="launchCopy">A cinematic product journey. Tap the icon, then let the story unfold.</p><div class="begin" id="beginCopy">Tap the icon to begin</div></div></div><div class="controls" id="controls"><button class="control" id="playBtn" aria-label="Pause autoplay" title="Pause autoplay">Ⅱ</button><button class="control playing" id="soundBtn" aria-label="Mute sound" title="Mute sound"><span class="soundWave"><i></i><i></i><i></i></span></button></div><div class="hint" id="hint"><b>Auto journey</b> · scroll anytime to take control</div><script>(()=>{const iframe=document.getElementById('story'),launch=document.getElementById('launch'),launchBtn=document.getElementById('launchBtn'),curtain=document.getElementById('curtain'),curtainSuit=document.getElementById('curtainSuit'),controls=document.getElementById('controls'),playBtn=document.getElementById('playBtn'),soundBtn=document.getElementById('soundBtn'),hint=document.getElementById('hint'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let doc,win,scenes=[],index=0,started=false,playing=true,soundOn=true,timer=null,audio=null,manualPauseTimer=null,transitioning=false;const suits=['♠','♥','♣','♦'];const dwell={hero:8500,why:5600,shift:7600,people:9000,loop:9000,proof:9800,value:9000,money:9000,fit:10000,final:12000};const getDwell=s=>s.id&&dwell[s.id]|| (s.classList.contains('compact')?6000:8200);function setupFrame(){try{doc=iframe.contentDocument;win=iframe.contentWindow;if(!doc)return;const ownStart=doc.getElementById('start');if(ownStart)ownStart.classList.add('hidden');doc.body.classList.remove('locked');scenes=[...doc.querySelectorAll('.scene')];doc.documentElement.style.scrollSnapType='y mandatory';doc.body.style.scrollBehavior='smooth';const injected=doc.createElement('style');injected.textContent='.scene{scroll-snap-stop:always}.scene:after{content:"";position:absolute;inset:auto 0 0;height:22%;pointer-events:none;background:linear-gradient(transparent,rgba(0,0,0,.12));z-index:-1}@media(prefers-reduced-motion:reduce){html{scroll-snap-type:none!important}}';doc.head.appendChild(injected);win.addEventListener('wheel',manualTakeover,{passive:true});win.addEventListener('touchstart',manualTakeover,{passive:true});win.addEventListener('keydown',e=>{if(['ArrowDown','ArrowUp','PageDown','PageUp',' ','Home','End'].includes(e.key))manualTakeover()});}catch(e){console.warn('LC frame setup',e)}}iframe.addEventListener('load',setupFrame);function ensureAudio(){if(audio)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=new AC()}function tone(freq=440,dur=.28,gain=.035,delay=0){if(!soundOn||!audio)return;const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+dur+.03)}function chime(){tone(392,.34,.022);tone(587,.42,.018,.06);tone(784,.5,.012,.12)}function startChord(){tone(261.6,.48,.025);tone(392,.55,.021,.05);tone(659.3,.65,.014,.1)}function whoosh(){if(!soundOn||!audio)return;const sr=audio.sampleRate,len=Math.floor(sr*.34),buf=audio.createBuffer(1,len,sr),data=buf.getChannelData(0);for(let i=0;i<len;i++){const env=Math.sin(Math.PI*i/len);data[i]=(Math.random()*2-1)*env*.5}const src=audio.createBufferSource(),filter=audio.createBiquadFilter(),g=audio.createGain();filter.type='bandpass';filter.frequency.value=700;filter.Q.value=.65;g.gain.value=.018;src.buffer=buf;src.connect(filter).connect(g).connect(audio.destination);src.start()}function shuffle(){if(!soundOn||!audio)return;const sr=audio.sampleRate;[0,.085].forEach(delay=>{const len=Math.floor(sr*.065),buf=audio.createBuffer(1,len,sr),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);const src=audio.createBufferSource(),f=audio.createBiquadFilter(),g=audio.createGain();f.type='highpass';f.frequency.value=1100;g.gain.value=.012;src.buffer=buf;src.connect(f).connect(g).connect(audio.destination);src.start(audio.currentTime+delay)})}function showCurtain(nextIndex,fromAuto=true){if(transitioning||!scenes.length)return;transitioning=true;clearTimeout(timer);curtainSuit.textContent=suits[nextIndex%suits.length];if(['♥','♦'].includes(curtainSuit.textContent))curtainSuit.style.color='rgba(197,78,88,.18)';else curtainSuit.style.color='rgba(255,255,255,.11)';whoosh();curtain.classList.add('on');setTimeout(()=>{index=Math.max(0,Math.min(nextIndex,scenes.length-1));scenes[index].scrollIntoView({behavior:'auto',block:'start'});shuffle();setTimeout(()=>{curtain.classList.remove('on');chime();transitioning=false;if(fromAuto&&playing)schedule()},280)},760)}function schedule(){clearTimeout(timer);if(!playing||!started||!scenes.length)return;if(index>=scenes.length-1){playBtn.textContent='↻';playBtn.setAttribute('aria-label','Replay journey');return}timer=setTimeout(()=>showCurtain(index+1,true),getDwell(scenes[index]))}function manualTakeover(){if(!started||transitioning)return;playing=false;clearTimeout(timer);playBtn.textContent='▶';playBtn.setAttribute('aria-label','Resume autoplay');clearTimeout(manualPauseTimer);manualPauseTimer=setTimeout(()=>{if(!playing){hint.innerHTML='<b>Journey paused</b> · press ▶ to continue automatically'}},1200)}function detectCurrent(){if(!scenes.length||!win)return;let best=0,dist=Infinity;scenes.forEach((s,i)=>{const d=Math.abs(s.getBoundingClientRect().top);if(d<dist){dist=d;best=i}});index=best}launchBtn.addEventListener('click',()=>{setupFrame();ensureAudio();if(audio&&audio.state==='suspended')audio.resume();startChord();started=true;playing=true;launch.classList.add('hide');controls.classList.add('show');hint.classList.add('show');setTimeout(()=>{if(scenes.length){index=0;scenes[0].scrollIntoView({behavior:'auto',block:'start'});chime();schedule()}},950)});playBtn.addEventListener('click',()=>{if(!started)return;if(playBtn.textContent==='↻'){index=0;playing=true;playBtn.textContent='Ⅱ';showCurtain(0,false);setTimeout(schedule,1700);return}playing=!playing;playBtn.textContent=playing?'Ⅱ':'▶';playBtn.setAttribute('aria-label',playing?'Pause autoplay':'Resume autoplay');if(playing){detectCurrent();hint.innerHTML='<b>Auto journey</b> · scroll anytime to take control';schedule()}else clearTimeout(timer)});soundBtn.addEventListener('click',()=>{soundOn=!soundOn;soundBtn.classList.toggle('playing',soundOn);soundBtn.setAttribute('aria-label',soundOn?'Mute sound':'Enable sound');if(soundOn){ensureAudio();if(audio&&audio.state==='suspended')audio.resume();chime()}});setInterval(()=>{if(started&&!transitioning)detectCurrent()},700);if(reduce){playing=false;playBtn.textContent='▶';soundOn=false;soundBtn.classList.remove('playing')}})();</script></body></html>
