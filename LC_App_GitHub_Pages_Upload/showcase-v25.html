rt',pause,{passive:true})}catch(e){console.warn(e)}}f.addEventListener('load',setup);function money(){const s=d&&d.getElementById('money'),x=s&&s.querySelector('.wrap');if(!x)return;x.innerHTML=`<div class="eyebrow" data-en="Commercial value" data-ru="Коммерческая ценность">Commercial value</div><h2 class="title" data-en="How value moves — and where LC can participate." data-ru="Как создаётся ценность — и где LC может зарабатывать.">How value moves — and where LC can participate.</h2><p class="lead" data-en="LC sits before and after the licensed game: discovery before play, relationship and return after it." data-ru="LC работает до и после лицензированной игры: помогает найти человека до игры и создаёт связь для возвращения после неё.">LC sits before and after the licensed game: discovery before play, relationship and return after it.</p><div class="moneySplit"><article class="moneyLane"><small>OPERATOR</small><h3 data-en="Acquire through people. Return through relationships." data-ru="Привлекать через людей. Возвращать через отношения.">Acquire through people. Return through relationships.</h3><div class="valueFlow"><span>Creator discovery</span><i>→</i><span>Handoff</span><i>→</i><span>Play</span><i>→</i><span>Follow / Live</span><i>→</i><span>Return</span></div><div class="moneyRow"><b data-en="1. Discovery & acquisition" data-ru="1. Discovery и привлечение">1. Discovery & acquisition</b><p data-en="A player discovers Sofia or another creator in LC, then follows a clear handoff into the operator's licensed environment." data-ru="Игрок находит Софию или другого creator в LC, после чего переходит в лицензированную среду оператора.">A player discovers Sofia or another creator in LC, then follows a clear handoff into the operator's licensed environment.</p><p class="how" data-en="LC value: a people-led entry point that can complement lobby, affiliate and campaign traffic." data-ru="Ценность LC: новый вход через человека, который может дополнять lobby, affiliate и campaign traffic.">LC value: a people-led entry point that can complement lobby, affiliate and campaign traffic.</p><p class="moneyModel" data-en="Possible economics: platform/service fee + campaign fee; performance participation only where attribution is agreed." data-ru="Возможная экономика: platform/service fee + campaign fee; performance-модель только при согласованной атрибуции.">Possible economics: platform/service fee + campaign fee; performance participation only where attribution is agreed.</p></div><div class="moneyRow"><b data-en="2. Return & retention" data-ru="2. Возврат и retention">2. Return & retention</b><p data-en="Following a creator, seeing a live signal or schedule gives the player a human reason to return to the same operator experience." data-ru="Подписка на creator, live-сигнал или расписание дают игроку человеческий повод снова вернуться к оператору.">Following a creator, seeing a live signal or schedule gives the player a human reason to return to the same operator experience.</p><p class="how" data-en="LC value: create and measure return journeys that begin with a creator rather than a generic promotion." data-ru="Ценность LC: создавать и измерять возвраты, которые начинаются с creator, а не с обычной промо-акции.">LC value: create and measure return journeys that begin with a creator rather than a generic promotion.</p><p class="moneyModel" data-en="Possible economics: service fee; agreed performance/revenue participation for attributable return activity." data-ru="Возможная экономика: service fee; согласованное performance/revenue participation для атрибутируемых возвратов.">Possible economics: service fee; agreed performance/revenue participation for attributable return activity.</p></div><div class="moneyRow"><b data-en="3. Creator economy" data-ru="3. Creator economy">3. Creator economy</b><p data-en="Optional subscriptions, tips, branded communities or creator-led campaigns can add monetization around the relationship without changing t
