style></head><body><div class="stage"><iframe id="story" src="showcase-v19.html" title="LC product journey"></iframe></div><div class="ambient" aria-hidden="true"><i class="card c1"></i><i class="card c2"></i><i class="card c3"></i><i class="card c4"></i></div><div class="curtain" id="curtain"><div class="mark"></div></div><div class="launch" id="launch"><div class="launchInner"><button class="appButton" id="launchBtn" aria-label="Begin LC journey"><span class="pulse"></span><img src="app-icon.svg" alt="LC App icon"></button><h1>Live Casino <span>through people.</span></h1><p>A guided product story. Tap the icon and let the journey unfold.</p><div class="begin">Tap the icon to begin</div></div></div><div class="controls" id="controls"><button class="control" id="playBtn" aria-label="Pause autoplay">Ⅱ</button></div><div class="hint" id="hint"><b>Auto journey</b> · scroll anytime to take control</div><script>(()=>{const f=document.getElementById('story'),launch=document.getElementById('launch'),btn=document.getElementById('launchBtn'),curtain=document.getElementById('curtain'),controls=document.getElementById('controls'),playBtn=document.getElementById('playBtn'),hint=document.getElementById('hint'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let d,w,scenes=[],i=0,started=false,playing=!reduce,timer,transitioning=false,manualTimer;const dwell={hero:5400,why:3200,shift:5000,people:6000,loop:6100,proof:6700,value:6200,money:11800,fit:7600,final:9000};function setup(){try{d=f.contentDocument;w=f.contentWindow;if(!d)return;const s=d.getElementById('start');if(s)s.classList.add('hidden');d.body.classList.remove('locked');scenes=[...d.querySelectorAll('.scene')];d.documentElement.style.scrollSnapType='y mandatory';const st=d.createElement('style');st.textContent=`.scene{scroll-snap-stop:always}.heroMedia,.creator,.surface{transition:transform .8s cubic-bezier(.16,1,.3,1),opacity .8s}.scene.active .heroMedia{transform:translateY(0) scale(1)}#people .creator:first-child{outline:1px solid rgba(89,232,199,.16);outline-offset:-1px}.commercialIntro{max-width:850px}.moneySplit{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:34px}.moneyLane{border:1px solid rgba(255,255,255,.09);border-radius:28px;padding:27px;background:linear-gradient(180deg,rgba(89,232,199,.035),rgba(255,255,255,.008));position:relative;overflow:hidden}.moneyLane:before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(180deg,#59e8c7,transparent 75%);opacity:.45}.moneyLane small{color:#59e8c7;font-weight:900;letter-spacing:.14em}.moneyLane h3{font-size:clamp(29px,3vw,45px);line-height:1.02;letter-spacing:-.045em;margin:12px 0 12px}.laneWhy{color:#9aa8a3;font-size:14px;line-height:1.55;margin:0 0 18px}.valueFlow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0 22px}.valueFlow span{border:1px solid rgba(255,255,255,.09);border-radius:999px;padding:8px 11px;color:#cbd6d2;font-size:11px}.valueFlow i{font-style:normal;color:#59e8c7}.moneyRow{padding:15px 0;border-top:1px solid rgba(255,255,255,.075)}.moneyRow b{display:block;font-size:16px;margin-bottom:5px}.moneyRow p{margin:0;color:#87938f;font-size:13px;line-height:1.5}.moneyModel{margin-top:7px!important;color:#c9fff4!important;font-size:12px!important}.moneyMechanic{margin-top:8px!important;color:#aab7b2!important;font-size:12px!important}.moneyMechanic strong{color:#f2f8f6}.moneyBridge{margin-top:22px;padding:20px 22px;border:1px solid rgba(89,232,199,.18);border-radius:22px;background:rgba(89,232,199,.035);font-size:clamp(18px,1.8vw,25px);line-height:1.3}.moneyProof{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.moneyProof div{padding:14px 15px;border-top:1px solid rgba(255,255,255,.08)}.moneyProof b{display:block;font-size:12px;margin-bottom:4px}.moneyProof span{color:#788580;font-size:11px;line-height:1.45}.moneyNote{margin-top:15px;color:#73807c;font-size:11px;line-height:1.5}@media(max-width:850px){.moneySplit{grid-template-columns:1fr}.moneyLane{padding:22px}.valueFlow{gap:6px}.valueFlow span{font-size:10px;padding:7px 9px}.moneyProof{grid-template-columns:1fr}}`;d.head.appendChild(st);money();w.addEventListener('wheel',pause,{passive:true});w.addEventListener('touchstart',pause,{passive:true});w.addEventListener('keydown',e=>{if(['ArrowDown','ArrowUp','PageDown','PageUp',' ','Home','End'].includes(e.key))pause()})}catch(e){console.warn('LC V24 setup',e)}}f.addEventListener('load',setup);function money(){const s=d&&d.getElementById('money'),x=s&&s.querySelector('.wrap');if(!x)return;x.innerHTML=`<div class="eyebrow" data-en="Commercial value" data-ru="Коммерческая ценность">Commercial value</div><h2 class="title" data-en="How each partner can make money with LC." data-ru="Как каждая сторона может зарабатывать вместе с LC.">How each partner can make money with LC.</h2><p class="lead commercialIntro" data-en="The core idea is simple: LC creates a new layer of discovery, return and creator relationships. Operators and providers keep doing what they already do best; LC adds new traffic paths and new monetizable surfaces around them." data-ru="Логика простая: LC создаёт новый слой discovery, возврата и отношений с creator-персонами. Операторы и провайдеры продолжают делать то, что уже умеют лучше всего; LC добавляет новые пути трафика и новые поверхности для монетизации вокруг них.">The core idea is simple: LC creates a new layer of discovery, return and creator relationships. Operators and providers keep doing what they already do best; LC adds new traffic paths and new monetizable surfaces around them.</p><div class="moneySplit"><article class="moneyLane"><small>OPERATOR</small><h3 data-en="Turn audience and live presence into measurable player value." data-ru="Превращать аудиторию и live-присутствие в измеримую ценность игрока.">Turn audience and live presence into measurable player value.</h3><p class="laneWhy" data-en="Why it matters: today an operator usually competes through games, bonuses and lobby placement. LC adds a human reason to choose the operator and a human reason to come back." data-ru="Почему это важно: сегодня оператор обычно конкурирует играми, бонусами и позициями в лобби. LC добавляет человеческую причину выбрать оператора и человеческую причину вернуться.">Why it matters: today an operator usually competes through games, bonuses and lobby placement. LC adds a human reason to choose the operator and a human reason to come back.</p><div class="valueFlow"><span>Discover creator</span><i>→</i><span>Operator handoff</span><i>→</i><span>Play</span><i>→</i><span>Follow / Live</span><i>→</i><span>Return</span></div><div class="moneyRow"><b data-en="1. Acquisition channel" data-ru="1. Канал привлечения">1. Acquisition channel</b><p data-en="A player discovers a creator in LC and enters the operator through that creator's live presence, profile or content." data-ru="Игрок находит creator-персону в LC и переходит к оператору через её эфир, профиль или контент.">A player discovers a creator in LC and enters the operator through that creator's live presence, profile or content.</p><p class="moneyMechanic" data-en="<strong>How value is created:</strong> new qualified traffic with a clear source." data-ru="<strong>Как создаётся ценность:</strong> новый целевой трафик с понятным источником."><strong>How value is created:</strong> new qualified traffic with a clear source.</p><p class="moneyModel" data-en="Possible LC model: platform fee, service fee, campaign fee or agreed acquisition fee." data-ru="Возможная модель LC: platform fee, service fee, campaign fee или согласованная acquisition fee.">Possible LC model: platform fee, service fee, campaign fee or agreed acquisition fee.</p></div><div class="moneyRow"><b data-en="2. Return & retention" data-ru="2. Возврат и retention">2. Return & retention</b><p data-en="Following a creator and receiving a live signal creates a specific reason to return, instead of relying only on generic CRM or bonus messaging." data-ru="Подписка на creator-персону и сигнал о её эфире создают конкретный повод вернуться, а не только очередное CRM-сообщение или бонус.">Following a creator and receiving a live signal creates a specific reason to return, instead of relying only on generic CRM or bonus messaging.</p><p class="moneyMechanic" data-en="<strong>How value is created:</strong> more return journeys into the operator's existing Live Casino." data-ru="<strong>Как создаётся ценность:</strong> больше возвратных сценариев в уже существующий Live Casino оператора."><strong>How value is created:</strong> more return journeys into the operator's existing Live Casino.</p><p class="moneyModel" data-en="Possible LC model: performance or revenue participation where attribution is agreed." data-ru="Возможная модель LC: performance или revenue participation, если атрибуция согласована.">Possible LC model: performance or revenue participation where attribution is agreed.</p></div><div class="moneyRow"><b data-en="3. Creator economy" data-ru="3. Creator economy">3. Creator economy</b><p data-en="Subscriptions, tips, premium communities and brand activations can sit around the creator relationship without replacing the core gaming product." data-ru="Подписки, чаевые, premium-сообщества и бренд-активации могут существовать вокруг creator-отношений, не заменяя основной игровой продукт.">Subscriptions, tips, premium communities and brand activations can sit around the creator relationship without replacing the core gaming product.</p><p class="moneyMechanic" data-en="<strong>How value is created:</strong> additional non-core-gaming revenue and stronger creator loyalty." data-ru="<strong>Как создаётся ценность:</strong> дополнительная выручка вне основной игры и более сильная лояльность к creator-персонам."><strong>How value is created:</strong> additional non-core-gaming revenue and stronger creator loyalty.</p><p class="moneyModel" data-en="Possible LC model: share of creator-economy activity or campaign revenue." data-ru="Возможная модель LC: доля от creator-economy активности или campaign revenue.">Possible LC model: share of creator-economy activity or campaign revenue.</p></div></article><article class="moneyLane"><small>PROVIDER</small><h3 data-en="Turn dealer talent and content into a people-led distribution channel." data-ru="Превращать дилеров и контент в people-led канал дистрибуции.">Turn dealer talent and content into a people-led distribution channel.</h3><p class="laneWhy" data-en="Why it matters: provider content normally depends on operator lobbies, integrations and placement. LC can create another discovery layer where a person becomes the doorway into the provider's tables and formats." data-ru="Почему это важно: контент провайдера обычно зависит от операторских лобби, интеграций и размещения. LC может добавить ещё один discovery-слой, где человек становится входом в столы и форматы провайдера.">Why it matters: provider content normally depends on operator lobbies, integrations and placement. LC can create another discovery layer where a person becomes the doorway into the provider's tables and formats.</p><div class="valueFlow"><span>Creator identity</span><i>→</i><span>Discovery</span><i>→</i><span>Table / format</span><i>→</i><span>Operator</span><i>→</i><span>Play</span></div><div class="moneyRow"><b data-en="1. Distribution access" data-ru="1. Доступ к дистрибуции">1. Distribution access</b><p data-en="Existing dealers, hosts, tables and formats gain a new discovery surface outside the traditional lobby hierarchy." data-ru="Существующие дилеры, ведущие, столы и форматы получают новую точку discovery вне традиционной иерархии лобби.">Existing dealers, hosts, tables and formats gain a new discovery surface outside the traditional lobby hierarchy.</p><p class="moneyMechanic" data-en="<strong>How value is created:</strong> more discoverability for existing content without rebuilding the game itself." data-ru="<strong>Как создаётся ценность:</strong> больше discoverability для существующего контента без переделки самой игры."><strong>How value is created:</strong> more discoverability for existing content without rebuilding the game itself.</p><p class="moneyModel" data-en="Possible LC model: platform or distribution access fee." data-ru="Возможная модель LC: platform или distribution access fee.">Possible LC model: platform or distribution access fee.</p></div><div class="moneyRow"><b data-en="2. Launch & activation" data-ru="2. Запуск и активация">2. Launch & activation</b><p data-en="A provider can use relevant creators to introduce a new table, format, branded game or studio concept to the right audience." data-ru="Провайдер может использовать релевантных creator-персон для запуска нового стола, формата, брендированной игры или студийного концепта перед нужной аудиторией.">A provider can use relevant creators to introduce a new table, format, branded game or studio concept to the right audience.</p><p class="moneyMechanic" data-en="<strong>How value is created:</strong> targeted product activation instead of relying only on lobby placement." data-ru="<strong>Как создаётся ценность:</strong> целевая активация продукта вместо зависимости только от размещения в лобби."><strong>How value is created:</strong> targeted product activation instead of relying only on lobby placement.</p><p class="moneyModel" data-en="Possible LC model: campaign, sponsorship or branded-activation fee." data-ru="Возможная модель LC: campaign, sponsorship или branded-activation fee.">Possible LC model: campaign, sponsorship or branded-activation fee.</p></div><div class="moneyRow"><b data-en="3. Measurable content performance" data-ru="3. Измеримый performance контента">3. Measurable content performance</b><p data-en="If provider, operator and LC agree attribution, discovery and handoff activity can be tied back to specific tables, creators or campaigns." data-ru="Если провайдер, оператор и LC согласовали атрибуцию, discovery и handoff-активность можно связать с конкретными столами, creator-персонами или кампаниями.">If provider, operator and LC agree attribution, discovery and handoff activity can be tied back to specific tables, creators or campaigns.</p><p class="moneyMechanic" data-en="<strong>How value is created:</strong> clearer evidence of which people and campaigns actually distribute content." data-ru="<strong>Как создаётся ценность:</strong> понятнее, какие люди и кампании реально дистрибутируют контент."><strong>How value is created:</strong> clearer evidence of which people and campaigns actually distribute content.</p><p class="moneyModel" data-en="Possible LC model: performance participation where measurable and contractually agreed." data-ru="Возможная модель LC: performance participation там, где результат измерим и согласован договором.">Possible LC model: performance participation where measurable and contractually agreed.</p></div></article></div><div class="moneyBridge" data-en="LC monetizes the relationship and distribution layer. The operator monetizes gameplay and player value. The provider monetizes its content and distribution footprint." data-ru="LC монетизирует слой отношений и дистрибуции. Оператор монетизирует игру и ценность игрока. Провайдер монетизирует свой контент и его дистрибуцию.">LC monetizes the relationship and distribution layer. The operator monetizes gameplay and player value. The provider monetizes its content and distribution footprint.</div><div class="moneyProof"><div><b data-en="What must be measurable" data-ru="Что нужно измерять">What must be measurable</b><span data-en="creator source, handoff, return journeys, campaign attribution" data-ru="источник creator, handoff, возвраты, атрибуция кампаний">creator source, handoff, return journeys, campaign attribution</span></div><div><b data-en="What stays partner-side" data-ru="Что остаётся у партнёра">What stays partner-side</b><span data-en="wallet, KYC/AML, wagering, settlement, regulated gameplay" data-ru="wallet, KYC/AML, ставки, расчёты, регулируемая игра">wallet, KYC/AML, wagering, settlement, regulated gameplay</span></div><div><b data-en="What remains to validate" data-ru="Что ещё нужно подтвердить">What remains to validate</b><span data-en="pricing, attribution rules, partner economics, market-by-market requirements" data-ru="цены, правила атрибуции, экономика партнёров, требования конкретных рынков">pricing, attribution rules, partner economics, market-by-market requirements</span></div></div><div class="moneyNote" data-en="Illustrative commercial directions only. No pricing, partner terms or revenue claims are represented as validated." data-ru="Это только возможные коммерческие направления. Цены, партнёрские условия и revenue claims здесь не заявляются как подтверждённые.">Illustrative commercial directions only. No pricing, partner terms or revenue claims are represented as validated.</div>`;const lang=d.documentElement.lang==='ru'?'ru':'en';x.querySelectorAll('[data-en]').forEach(n=>n.innerHTML=n.dataset[lang])}function schedule(){clearTimeout(timer);if(!started||!playing||!scenes.length||i>=scenes.length-1)return;const s=scenes[i],ms=(s.id&&dwell[s.id])||(s.classList.contains('compact')?3300:5700);timer=setTimeout(()=>go(i+1),ms)}function go(n){if(transitioning||!scenes.length)return;transitioning=true;clearTimeout(timer);curtain.classList.add('on');setTimeout(()=>{i=Math.max(0,Math.min(n,scenes.length-1));scenes[i].scrollIntoView({behavior:'auto',block:'start'});setTimeout(()=>{curtain.classList.remove('on');transitioning=false;schedule()},240)},500)}function current(){if(!scenes.length)return;let best=0,dist=1e9;scenes.forEach((s,k)=>{const v=Math.abs(s.getBoundingClientRect().top);if(v<dist){dist=v;best=k}});i=best}function pause(){if(!started||transitioning)return;playing=false;clearTimeout(timer);playBtn.textContent='▶';clearTimeout(manualTimer);manualTimer=setTimeout(()=>hint.innerHTML='<b>Journey paused</b> · press ▶ to continue',850)}btn.onclick=()=>{setup();started=true;playing=!reduce;launch.classList.add('hide');controls.classList.add('show');hint.classList.add('show');setTimeout(()=>{if(scenes.length){i=0;scenes[0].scrollIntoView({behavior:'auto',block:'start'});schedule()}},900)};playBtn.onclick=()=>{if(!started)return;if(i>=scenes.length-1&&!playing){i=0;playing=true;playBtn.textContent='Ⅱ';go(0);return}playing=!playing;playBtn.textContent=playing?'Ⅱ':'▶';if(playing){current();hint.innerHTML='<b>Auto journey</b> · scroll anytime to take control';schedule()}else clearTimeout(timer)};setInterval(()=>{if(started&&!transitioning)current()},700);if(reduce){playing=false;playBtn.textContent='▶'}})();</script></body></html>
