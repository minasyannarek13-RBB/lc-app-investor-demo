id rgba(255,255,255,.1);background:rgba(2,4,4,.58);backdrop-filter:blur(12px);color:#dce7e3;border-radius:50%;display:grid;place-items:center;cursor:pointer;font-weight:850;transition:.25s}.control:hover{border-color:rgba(89,232,199,.28);color:var(--mint2);transform:translateY(-2px)}.hint{position:fixed;left:18px;bottom:19px;z-index:760;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.35);opacity:0;transition:opacity .6s}.hint.show{opacity:1}.hint b{color:var(--mint);font-weight:800}.soundWave{display:flex;gap:2px;align-items:end;height:13px}.soundWave i{display:block;width:2px;background:currentColor;border-radius:2px;height:5px}.soundWave i:nth-child(2){height:10px}.soundWave i:nth-child(3){height:7px}.playing .soundWave i{animation:wave 1.4s ease-in-out infinite alternate}.playing .soundWave i:nth-child(2){animation-delay:.25s}.playing .soundWave i:nth-child(3){animation-delay:.5s}@keyframes wave{to{height:12px}}@media(max-width:650px){.appButton{width:124px;height:124px}.appButton img{border-radius:28px}.pulse{inset:-18px}.launch h1{font-size:44px}.launch p{font-size:14px;max-width:88%}.controls{right:12px;bottom:12px}.hint{left:12px;bottom:16px;max-width:50vw;line-height:1.45}.suit{font-size:64px}.ambient:before,.ambient:after{opacity:.4}}@media(prefers-reduced-motion:reduce){.pulse,.playing .soundWave i,.ambient:before,.ambient:after,.suit{animation:none}.curtain,.curtainSuit,.launch,.controls{transition:none}.ambient{display:none}}</style></head><body><div class="stage"><iframe id="story" src="showcase-v19.html" title="LC product journey"></iframe></div><div class="ambient" aria-hidden="true"><div class="suit s1">♠</div><div class="suit red s2">♥</div><div class="suit s3">♣</div><div class="suit red s4">♦</div></div><div class="curtain" id="curtain" aria-hidden="true"><div class="curtainSuit" id="curtainSuit">♠</div></div><div class="launch" id="launch"><div class="launchInner"><button class="appButton" id="launchBtn" aria-label="Begin LC journey"><span class="pulse"></span><img src="app-icon.svg" alt="LC App icon"></button><h1 id="launchTitle">Live Casino <span>through people.</span></h1><p id="launchCopy">A cinematic product journey with an ambient soundtrack.</p><div class="begin" id="beginCopy">Tap the icon to begin</div></div></div><div class="controls" id="controls"><button class="control" id="playBtn" aria-label="Pause autoplay">Ⅱ</button><button class="control playing" id="soundBtn" aria-label="Mute soundtrack"><span class="soundWave"><i></i><i></i><i></i></span></button></div><div class="hint" id="hint"><b>Auto journey</b> · scroll anytime to take control</div><script>(()=>{const iframe=document.getElementById('story'),launch=document.getElementById('launch'),launchBtn=document.getElementById('launchBtn'),curtain=document.getElementById('curtain'),curtainSuit=document.getElementById('curtainSuit'),controls=document.getElementById('controls'),playBtn=document.getElementById('playBtn'),soundBtn=document.getElementById('soundBtn'),hint=document.getElementById('hint'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let doc,win,scenes=[],index=0,started=false,playing=true,soundOn=true,timer=null,manualPauseTimer=null,transitioning=false,audio=null,master=null,reverb=null,musicTimer=null,nextBar=0,barIndex=0;const suits=['♠','♥','♣','♦'];const dwell={hero:6500,why:3800,shift:6200,people:7200,loop:7200,proof:7800,value:7000,money:8200,fit:8200,final:10000};const getDwell=s=>s.id&&dwell[s.id]||(s.classList.contains('compact')?3800:6500);function setupFrame(){try{doc=iframe.contentDocument;win=iframe.contentWindow;if(!doc)return;const ownStart=doc.getElementById('start');if(ownStart)ownStart.classList.add('hidden');doc.body.classList.remove('locked');scenes=[...doc.querySelectorAll('.scene')];doc.documentElement.style.scrollSnapType='y mandatory';const injected=doc.createElement('style');injected.textContent='.scene{scroll-snap-stop:always}.moneySplit{display:grid;grid-t -en="LC does not need to replace the operator or provider. It can monetize discovery, return traffic and creator relationships around them." data-ru="LC не нужно заменять оператора или провайдера. Монетизация строится вокруг discovery, возврата игроков и отношений с creator-персонами.">LC does not need to replace the operator or provider. It can monetize discovery, return traffic and creator relationships around them.</p><div class="moneySplit"><article class="moneyLane"><small>OPERATOR</small><h3 data-en="Turn creator relationships into player intent." data-ru="Превращать отношения с creator-персонами в намерение игрока вернуться.">Turn creator relationships into player intent.</h3><div class="moneyRow"><b data-en="Creator-led acquisition" data-ru="Привлечение через creator-персон">Creator-led acquisition</b><span data-en="Players discover a person first, then move into the licensed operator environment." data-ru="Игрок сначала находит человека, а затем переходит в лицензированную среду оператора.">Players discover a person first, then move into the licensed operator environment.</span><span class="moneyModel" data-en="Possible model: platform / service / campaign fee" data-ru="Возможная модель: platform / service / campaign fee">Possible model: platform / service / campaign fee</span></div><div class="moneyRow"><b data-en="Return & retention" data-ru="Возврат и retention">Return & retention</b><span data-en="Follow and live signals can create a reason to come back to the operator." data-ru="Подписки и live-сигналы могут создавать естественный повод вернуться к оператору.">Follow and live signals can create a reason to come back to the operator.</span><span class="moneyModel" data-en="Possible model: performance or revenue participation where attribution is agreed" data-ru="Возможная модель: performance / revenue share, если атрибуция согласована">Possible model: performance or revenue participation where attribution is agreed</span></div><div class="moneyRow"><b data-en="Creator economy" data-ru="Creator economy">Creator economy</b><span data-en="Subscriptions, tips and brand activity can sit around the player-creator relationship." data-ru="Подписки, чаевые и бренд-активации могут работать вокруг отношений игрока и creator-персоны.">Subscriptions, tips and brand activity can sit around the player-creator relationship.</span><span class="moneyModel" data-en="Possible model: share of creator-economy activity" data-ru="Возможная модель: доля от creator-economy активности">Possible model: share of creator-economy activity</span></div></article><article class="moneyLane"><small>PROVIDER</small><h3 data-en="Give existing Live Casino content a human distribution layer." data-ru="Добавить существующему Live Casino контенту человеческий слой дистрибуции.">Give existing Live Casino content a human distribution layer.</h3><div class="moneyRow"><b data-en="Content discovery" data-ru="Discovery контента">Content discovery</b><span data-en="Dealer identities can become new discovery surfaces around existing tables and game formats." data-ru="Идентичность дилера может стать новой точкой discovery вокруг существующих столов и игровых форматов.">Dealer identities can become new discovery surfaces around existing tables and game formats.</span><span class="moneyModel" data-en="Possible model: platform / distribution access fee" data-ru="Возможная модель: platform / distribution access fee">Possible model: platform / distribution access fee</span></div><div class="moneyRow"><b data-en="Launch & activation" data-ru="Запуски и активации">Launch & activation</b><span data-en="Creator-led campaigns can amplify new tables, formats or branded content." data-ru="Creator-кампании могут усиливать запуск новых столов, форматов или branded-контента.">Creator-led campaigns can amplify new tables, formats or branded content.</span><span class="moneyModel" data-en="Possible model: campaign / sponsorship fee" data-ru="Возможная модель: campaign / sponsorship fee">Possible model: campaign / sponsorship fee</span></div><div class="moneyRow"><b data-en="Attributable distribution" data-ru="Атрибутируемая дистрибуция">Attributable distribution</b><span data-en="If traffic into provider content can be measured, commercial participation can follow performance." data-ru="Если переходы в контент провайдера можно измерить, коммерческая модель может быть привязана к результату.">If traffic into provider content can be measured, commercial participation can follow performance.</span><span class="moneyModel" data-en="Possible model: performance participation" data-ru="Возможная модель: performance participation">Possible model: performance participation</span></div></article></div><div class="moneyBridge" data-en="LC monetizes the relationship and distribution layer around licensed gaming, not the regulated game operation itself." data-ru="LC монетизирует слой отношений и дистрибуции вокруг лицензированной игры, а не сам регулируемый игровой процесс.">LC monetizes the relationship and distribution layer around licensed gaming, not the regulated game operation itself.</div><div class="disclosure" data-en="Commercial directions are illustrative and to be validated with operators, providers and applicable market requirements." data-ru="Коммерческие направления являются рабочими гипотезами и требуют валидации с операторами, провайдерами и требованиями конкретного рынка.">Commercial directions are illustrative and to be validated with operators, providers and applicable market requirements.</div>`;const l=localStorage.getItem('lc-lang')||'en';w.querySelectorAll('[data-en][data-ru]').forEach(el=>el.innerHTML=el.dataset[l])}function ensureAudio(){if(audio)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=new AC();master=audio.createGain();master.gain.value=.0001;const dry=audio.createGain(),wet=audio.createGain();wet.gain.value=.34;reverb=audio.createConvolver();const len=audio.sampleRate*2.8,imp=audio.createBuffer(2,len,audio.sampleRate);for(let c=0;c<2;c++){const d=imp.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.8)}reverb.buffer=imp;master.connect(dry).connect(audio.destination);master.connect(reverb);reverb.connect(wet).connect(audio.destination)}function fadeMaster(v,d=.8){if(!audio||!master)return;const t=audio.currentTime;master.gain.cancelScheduledValues(t);master.gain.setValueAtTime(Math.max(master.gain.value,.0001),t);master.gain.exponentialRampToValueAtTime(Math.max(v,.0001),t+d)}function voice(freq,start,dur,gain=.012,type='sine',det=0){const o=audio.createOscillator(),g=audio.createGain(),f=audio.createBiquadFilter();o.type=type;o.detune.value=det;o.frequency.value=freq;f.type='lowpass';f.frequency.value=1100;f.Q.value=.4;g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(gain,start+1.1);g.gain.setValueAtTime(gain,start+Math.max(1.2,dur-1.4));g.gain.exponentialRampToValueAtTime(.0001,start+dur);o.connect(f).connect(g).connect(master);o.start(start);o.stop(start+dur+.1)}const chords=[[73.42,110,146.83,220],[65.41,98,130.81,196],[58.27,87.31,116.54,174.61],[65.41,98,146.83,196]];function scheduleBar(t){const c=chords[barIndex++%chords.length];c.forEach((f,i)=>{voice(f,t,8.4,i<2?.009:.006,i===0?'triangle':'sine',i%2?4:-4)});if(barIndex%2===0)voice(c[2]*2,t+3.8,3.5,.0025,'sine',6)}function musicLoop(){if(!audio||!soundOn)return;while(nextBar<audio.currentTime+10){scheduleBar(nextBar);nextBar+=8}musicTimer=setTimeout(musicLoop,2200)}function introMusic(){ensureAudio();if(!audio)return;if(audio.state==='suspended')audio.resume();nextBar=audio.currentTime+.25;barIndex=0;fadeMaster(.52,1.9);voice(73.42,audio.currentTime+.05,3.2,.018,'triangle');voice(110,audio.currentTime+.12,3.5,.013,'sine',-5);voice(146.83,audio.currentTime+.18,3.8,.009,'sine',5);setTimeout(()=>{musicLoop()},1800)}function transitionSwell(){if(!soundOn||!audio)return;const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain(),f=audio.createBiquadFilter();o.type='sine';o.frequency.setValueAtTime(55,t);o.frequency.exponentialRampToValueAtTime(82,t+.7);f.type='lowpass';f.frequency.value=280;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.006,t+.18);g.gain.exponentialRampToValueAtTime(.0001,t+.9);o.connect(f).connect(g).connect(master);o.start(t);o.stop(t+1)}function showCurtain(nextIndex,fromAuto=true){if(transitioning||!scenes.length)return;transitioning=true;clearTimeout(timer);curtainSuit.textContent=suits[nextIndex%suits.length];curtainSuit.style.color=['♥','♦'].includes(curtainSuit.textContent)?'rgba(179,75,85,.12)':'rgba(255,255,255,.075)';fadeMaster(.22,.35);transitionSwell();curtain.classList.add('on');setTimeout(()=>{index=Math.max(0,Math.min(nextIndex,scenes.length-1));scenes[index].scrollIntoView({behavior:'auto',block:'start'});setTimeout(()=>{curtain.classList.remove('on');fadeMaster(.52,.8);transitioning=false;if(fromAuto&&playing)schedule()},220)},610)}function schedule(){clearTimeout(timer);if(!playing||!started||!scenes.length)return;if(index>=scenes.length-1){playBtn.textContent='↻';return}timer=setTimeout(()=>showCurtain(index+1,true),getDwell(scenes[index]))}function manualTakeover(){if(!started||transitioning)return;playing=false;clearTimeout(timer);playBtn.textContent='▶';clearTimeout(manualPauseTimer);manualPauseTimer=setTimeout(()=>hint.innerHTML='<b>Journey paused</b> · press ▶ to continue automatically',900)}function detectCurrent(){if(!scenes.length)return;let best=0,dist=Infinity;scenes.forEach((s,i)=>{const d=Math.abs(s.getBoundingClientRect().top);if(d<dist){dist=d;best=i}});index=best}launchBtn.addEventListener('click',()=>{setupFrame();introMusic();started=true;playing=true;launch.classList.add('hide');controls.classList.add('show');hint.classList.add('show');setTimeout(()=>{if(scenes.length){index=0;scenes[0].scrollIntoView({behavior:'auto',block:'start'});schedule()}},1250)});playBtn.addEventListener('click',()=>{if(!started)return;if(playBtn.textContent==='↻'){index=0;playing=true;playBtn.textContent='Ⅱ';showCurtain(0,false);setTimeout(schedule,1300);return}playing=!playing;playBtn.textContent=playing?'Ⅱ':'▶';if(playing){detectCurrent();hint.innerHTML='<b>Auto journey</b> · scroll anytime to take control';schedule()}else clearTimeout(timer)});soundBtn.addEventListener('click',()=>{soundOn=!soundOn;soundBtn.classList.toggle('playing',soundOn);if(soundOn){ensureAudio();if(audio&&audio.state==='suspended')audio.resume();fadeMaster(.52,.8);if(!musicTimer){nextBar=audio.currentTime+.1;musicLoop()}}else fadeMaster(.0001,.65)});setInterval(()=>{if(started&&!transitioning)detectCurrent()},700);const lang=localStorage.getItem('lc-lang')||'en';if(lang==='ru'){document.getElementById('launchTitle').innerHTML='Live Casino <span>через людей.</span>';document.getElementById('launchCopy').textContent='Кинематографичное путешествие по продукту с фоновой музыкой.';document.getElementById('beginCopy').textContent='Нажмите на иконку, чтобы начать'}if(reduce){playing=false;playBtn.textContent='▶';soundOn=false;soundBtn.classList.remove('playing')}})();</script></body></html>
