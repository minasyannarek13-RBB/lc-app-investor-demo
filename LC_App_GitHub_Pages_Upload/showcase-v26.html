ion-delay:.16s}.scene.active .creator:nth-child(4){animation-delay:.24s}@keyframes lcCamera{0%{transform:scale(1.018) translate3d(0,7px,0)}100%{transform:scale(1.045) translate3d(0,-3px,0)}}@keyframes lcLift{0%{opacity:.7;transform:translate3d(0,18px,0) scale(.99)}100%{opacity:1;transform:none}}@keyframes lcCardIn{0%{opacity:.25;transform:translate3d(0,24px,0) scale(.985)}100%{opacity:1;transform:none}}#money .moneyLane{box-shadow:inset 0 1px rgba(255,255,255,.025);background:linear-gradient(145deg,rgba(89,232,199,.032),rgba(255,255,255,.006) 48%,rgba(0,0,0,.04))!important}#money .moneyRow{position:relative;padding-left:2px}#money .moneyRow b{color:#eff7f4}#money .moneyModel{border-left:1px solid rgba(89,232,199,.28);padding-left:9px}#money .economics{margin-top:24px!important}#money .econ{min-height:74px}#money .moneyBridge{background:linear-gradient(90deg,rgba(89,232,199,.045),rgba(89,232,199,.012))!important}.sofiaTag{position:absolute;right:2%;bottom:4%;z-index:4;padding:8px 11px;border:1px solid rgba(255,255,255,.08);border-radius:999px;background:rgba(1,3,3,.64);color:#c9fff4;font-size:9px;letter-spacing:.13em;text-transform:uppercase;opacity:.72}@media(max-width:850px){.sofiaTag{display:none}#money .moneyRow{padding-top:16px;padding-bottom:16px}#money .moneyModel{font-size:11px!important}.title{letter-spacing:-.045em!important}}@media(prefers-reduced-motion:reduce){.scene.active .heroMedia,.scene.active .surface,.scene.active .creator{animation:none}.heroMedia,.portrait,.surface,.creator{will-change:auto}}`;d.head.appendChild(st);const hero=d.getElementById('hero');if(hero){const media=hero.querySelector('.heroMedia');if(media&&!media.querySelector('.sofiaTag')){const tag=d.createElement('span');tag.className='sofiaTag';tag.textContent='SOFIA · CREATOR';media.appendChild(tag)}}w.addEventListener('wheel',takeover,{passive:true});w.addEventListener('touchstart',takeover,{passive:true});w.addEventListener('keydown',e=>{if(['ArrowDown','ArrowUp','PageDown','PageU
