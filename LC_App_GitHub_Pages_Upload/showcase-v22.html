<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LC — Cinematic Journey V22</title><meta name="description" content="LC is a social discovery and return layer for Live Casino, built around people."><style>:root{--bg:#010202;--mint:#59e8c7;--mint2:#c9fff4;--text:#f6fbf9;--soft:#aebdb8;--ease:cubic-bezier(.16,1,.3,1);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text)}button{font:inherit}.stage{position:fixed;inset:0;background:#020303}.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#020303}.launch{position:fixed;inset:0;z-index:900;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,rgba(89,232,199,.09),transparent 29%),radial-gradient(circle at 50% 80%,rgba(65,84,81,.09),transparent 42%),#010202;transition:opacity 1.35s var(--ease),visibility 1.35s}.launch.hide{opacity:0;visibility:hidden;pointer-events:none}.launchInner{width:min(91vw,720px);text-align:center;position:relative}.appButton{width:172px;height:172px;border:0;background:none;padding:0;cursor:pointer;position:relative;border-radius:42px;filter:drop-shadow(0 34px 100px rgba(0,0,0,.76));transition:transform .6s var(--ease),filter .6s var(--ease)}.appButton:hover{transform:scale(1.045);filter:drop-shadow(0 28px 92px rgba(89,232,199,.18))}.appButton:active{transform:scale(.985)}.appButton img{width:100%;height:100%;display:block;border-radius:38px}.pulse,.pulse:before,.pulse:after{position:absolute;content:"";border:1px solid rgba(201,255,244,.15);border-radius:58px}.pulse{inset:-27px;animation:pulse 3.8s ease-in-out infinite}.pulse:before{inset:-18px;opacity:.34}.pulse:after{inset:-40px;opacity:.14}@keyframes pulse{50%{transform:scale(1.023);opacity:.47}}.launch h1{f eY(12px);transition:opacity .6s var(--ease),transform .6s var(--ease)}.controls.show{opacity:1;transform:none}.control{width:42px;height:42px;border:1px solid rgba(255,255,255,.1);background:rgba(2,4,4,.6);backdrop-filter:blur(12px);color:#dce7e3;border-radius:50%;display:grid;place-items:center;cursor:pointer;font-weight:850;transition:.25s}.control:hover{border-color:rgba(89,232,199,.28);color:var(--mint2);transform:translateY(-2px)}.hint{position:fixed;left:18px;bottom:19px;z-index:760;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.34);opacity:0;transition:opacity .6s}.hint.show{opacity:1}.hint b{color:var(--mint);font-weight:800}.soundWave{display:flex;gap:2px;align-items:end;height:13px}.soundWave i{display:block;width:2px;background:currentColor;border-radius:2px;height:5px}.soundWave i:nth-child(2){height:10px}.soundWave i:nth-child(3){height:7px}.playing .soundWave i{animation:wave 1.55s ease-in-out infinite alternate}.playing .soundWave i:nth-child(2){animation-delay:.25s}.playing .soundWave i:nth-child(3){animation-delay:.5s}@keyframes wave{to{height:12px}}@media(max-width:650px){.appButton{width:126px;height:126px}.appButton img{border-radius:29px}.pulse{inset:-18px}.launch h1{font-size:45px}.launch p{font-size:14px;max-width:89%}.controls{right:12px;bottom:12px}.hint{left:12px;bottom:16px;max-width:52vw;line-height:1.45}.suit{font-size:62px}.ambient:before,.ambient:after{opacity:.4}}@media(prefers-reduced-motion:reduce){.pulse,.playing .soundWave i,.ambient:before,.ambient:after,.suit{animation:none}.curtain,.curtainSuit,.launch,.controls{transition:none}.ambient{display:none}}</style></head><body><div class="stage"><iframe id="story" src="showcase-v19.html" title="LC product journey"></iframe></div><div class="ambient" aria-hidden="true"><div class="suit s1">♠</div><div class="suit red s2">♥</div><div class="suit s3">♣</div><div class="suit red s4">♦</div></div><div class="curtain" id="curtain" aria-hidden="true"><div class="curtainSuit" id="curtainSuit">♠</div></div><div class="launch" id="launch"><div class="launchInner"><button class="appButton" id="launchBtn" aria-label="Begin LC journey"><span class="pulse"></span><img src="app-icon.svg" alt="LC App icon"></button><h1>Live Casino <span>through people.</span></h1><p>A cinematic product journey about turning a table session into a relationship that can continue.</p><div class="begin">Tap the icon to begin</div></div></div><div class="controls" id="controls"><button class="control" id="playBtn" aria-label="Pause autoplay">Ⅱ</button><button class="control playing" id="soundBtn" aria-label="Mute soundtrack"><span class="soundWave"><i></i><i></i><i></i></span></button></div><div class="hint" id="hint"><b>Auto journey</b> · scroll anytime to take control</div><script>(()=>{const iframe=document.getElementById('story'),launch=document.getElementById('launch'),launchBtn=document.getElementById('launchBtn'),curtain=document.getElementById('curtain'),curtainSuit=document.getElementById('curtainSuit'),controls=document.getElementById('controls'),playBtn=document.getElementById('playBtn'),soundBtn=document.getElementById('soundBtn'),hint=document.getElementById('hint'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let doc,win,scenes=[],index=0,started=false,playing=true,soundOn=true,timer=null,transitioning=false,audio=null,master=null,musicTimer=null,manualPauseTimer=null;const suits=['♠','♥','♣','♦'];const dwell={hero:5800,why:3200,shift:5200,people:6200,loop:6200,proof:7000,value:6200,money:7600,fit:7600,final:9200};const getDwell=s=>s.id&&dwell[s.id]||(s.classList.contains('compact')?3200:5700);function setupFrame(){try{doc=iframe.contentDocument;win=iframe.contentWindow;if(!doc)return;const ownStart=doc.getElementById('start');if(ownStart)ownStart.classList.add('hidden');doc.body.classList.remove('locked');scenes=[...doc.querySelectorAll('.scene')];doc.documentElement.style.scrollSnapType='y mandatory';const injec mmercial value</div><h2 class="title" data-en="LC can monetize the relationship before and after the game." data-ru="LC может монетизировать отношения до и после самой игры.">LC can monetize the relationship before and after the game.</h2><p class="lead" data-en="The product sits above the licensed gaming stack and can create measurable value around discovery, return traffic and creator relationships." data-ru="Продукт работает поверх лицензированной игровой инфраструктуры и может создавать измеримую ценность через discovery, возврат игроков и отношения с creator-персонами.">The product sits above the licensed gaming stack and can create measurable value around discovery, return traffic and creator relationships.</p><div class="commercialMap"><article class="commercialLane"><small>OPERATOR</small><h3 data-en="More intent. More reasons to return." data-ru="Больше намерения. Больше поводов вернуться.">More intent. More reasons to return.</h3><div class="flowRow"><b data-en="Creator discovery" data-ru="Discovery через creator">Creator discovery</b><i>→</i><span data-en="Player enters through a person, then moves into the licensed operator environment." data-ru="Игрок приходит через конкретного человека, а затем переходит в лицензированную среду оператора.">Player enters through a person, then moves into the licensed operator environment.</span></div><span class="moneyModel" data-en="Possible value capture: platform / service / campaign fee" data-ru="Возможная монетизация: platform / service / campaign fee">Possible value capture: platform / service / campaign fee</span><div class="flowRow"><b data-en="Follow + Live" data-ru="Follow + Live">Follow + Live</b><i>→</i><span data-en="The player receives a reason to return when the creator is live again." data-ru="Игрок получает естественный повод вернуться, когда creator снова в эфире.">The player receives a reason to return when the creator is live again.</span></div><span class="moneyModel" data-en="Possible value capture: performance / attributable revenue participation" data-ru="Возможная монетизация: performance / доля от атрибутируемого результата">Possible value capture: performance / attributable revenue participation</span><div class="flowRow"><b data-en="Creator economy" data-ru="Creator economy">Creator economy</b><i>→</i><span data-en="Subscriptions, tips and branded activity create additional non-game relationship revenue." data-ru="Подписки, чаевые и бренд-активации создают дополнительную выручку вокруг отношений с аудиторией.">Subscriptions, tips and branded activity create additional non-game relationship revenue.</span></div><span class="moneyModel" data-en="Possible value capture: share of creator-economy activity" data-ru="Возможная монетизация: доля от creator-economy активности">Possible value capture: share of creator-economy activity</span></article><article class="commercialLane"><small>PROVIDER</small><h3 data-en="Turn tables into discoverable human destinations." data-ru="Превратить столы в человеческие точки притяжения.">Turn tables into discoverable human destinations.</h3><div class="flowRow"><b data-en="Human discovery layer" data-ru="Человеческий discovery layer">Human discovery layer</b><i>→</i><span data-en="Dealer identities create new entry points around existing tables, games and formats." data-ru="Идентичность дилеров создаёт новые точки входа вокруг уже существующих столов, игр и форматов.">Dealer identities create new entry points around existing tables, games and formats.</span></div><span class="moneyModel" data-en="Possible value capture: platform / distribution access fee" data-ru="Возможная монетизация: platform / distribution access fee">Possible value capture: platform / distribution access fee</span><div class="flowRow"><b data-en="Launch & activation" data-ru="Запуски и активации">Launch & activation</b><i>→</i><span data-en="Creators can become a launch surface for new tables, branded formats or campaigns." data-ru="Creator-персоны могут стать площадкой запуска новых столов, branded-форматов и кампаний.">Creators can become a launch surface for new tables, branded formats or campaigns.</span></div><span class="moneyModel" data-en="Possible value capture: campaign / sponsorship fee" data-ru="Возможная монетизация: campaign / sponsorship fee">Possible value capture: campaign / sponsorship fee</span><div class="flowRow"><b data-en="Attributed distribution" data-ru="Атрибутируемая дистрибуция">Attributed distribution</b><i>→</i><span data-en="Where partner attribution exists, LC can participate in measurable traffic or gaming value." data-ru="Если партнёры могут согласовать атрибуцию, LC может участвовать в измеримом трафике или игровой ценности.">Where partner attribution exists, LC can participate in measurable traffic or gaming value.</span></div><span class="moneyModel" data-en="Possible value capture: performance participation" data-ru="Возможная монетизация: performance participation">Possible value capture: performance participation</span></article></div><div class="valueCapture" data-en="LC captures value from the relationship and distribution layer. The licensed operator/provider keeps the regulated gaming activity." data-ru="LC монетизирует слой отношений и дистрибуции. Регулируемая игровая деятельность остаётся у лицензированного оператора или провайдера.">LC captures value from the relationship and distribution layer. The licensed operator/provider keeps the regulated gaming activity.</div><div class="disclosure" data-en="Possible commercial directions only. No announced pricing, signed commercial terms or validated revenue model is represented." data-ru="Это возможные коммерческие направления. Здесь не заявляются утверждённые тарифы, подписанные условия или подтверждённая revenue-модель.">Possible commercial directions only. No announced pricing, signed commercial terms or validated revenue model is represented.</div>`;const l=localStorage.getItem('lc-lang')||'en';w.querySelectorAll('[data-en][data-ru]').forEach(el=>el.innerHTML=el.dataset[l])}function ensureAudio(){if(audio)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=new AC();master=audio.createGain();master.gain.value=.075;const compressor=audio.createDynamicsCompressor();compressor.threshold.value=-24;compressor.knee.value=18;compressor.ratio.value=3;compressor.attack.value=.02;compressor.release.value=.6;master.connect(compressor).connect(audio.destination)}function pad(freq,t,dur,gain=.012,type='sine'){if(!audio||!soundOn)return;const o=audio.createOscillator(),g=audio.createGain(),f=audio.createBiquadFilter();o.type=type;o.frequency.value=freq;f.type='lowpass';f.frequency.value=1100;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.8);g.gain.setValueAtTime(gain*.9,t+dur-.9);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(f).connect(g).connect(master);o.start(t);o.stop(t+dur+.05)}function shimmer(freq,t,dur,g=.003){if(!audio||!soundOn)return;const o=audio.createOscillator(),gain=audio.createGain();o.type='sine';o.frequency.value=freq;gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(g,t+.35);gain.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(gain).connect(master);o.start(t);o.stop(t+dur+.03)}function scheduleMusic(){if(!audio||!soundOn)return;clearTimeout(musicTimer);const now=audio.currentTime+.08;const bars=[[55,82.41,110],[55,73.42,110],[49,73.42,98],[55,82.41,123.47]];const chord=bars[(index+Math.floor(performance.now()/12000))%bars.length];chord.forEach((f,i)=>pad(f,now,7.2,i===0?.013:.008,i===0?'triangle':'sine'));shimmer(chord[2]*2,now+1.2,3.6,.0024);musicTimer=setTimeout(scheduleMusic,6500)}function introMusic(){if(!audio||!soundOn)return;const t=audio.currentTime+.05;pad(55,t,5.4,.014,'triangle');pad(82.41,t+.2,5.2,.009);pad(110,t+.55,4.9,.007);shimmer(220,t+1.1,3.5,.003);shimmer(329.63,t+2.4,2.2,.0022)}function transitionSwell(){if(!audio||!soundOn)return;const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain(),f=audio.createBiquadFilter();o.type='sine';o.frequency.setValueAtTime(95,t);o.frequency.exponentialRampToValueAtTime(145,t+.72);f.type='lowpass';f.frequency.value=650;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.008,t+.28);g.gain.exponentialRampToValueAtTime(.0001,t+.85);o.connect(f).connect(g).connect(master);o.start(t);o.stop(t+.9)}function showCurtain(nextIndex,fromAuto=true){if(transitioning||!scenes.length)return;transitioning=true;clearTimeout(timer);curtainSuit.textContent=suits[nextIndex%suits.length];curtainSuit.style.color=['♥','♦'].includes(curtainSuit.textContent)?'rgba(179,75,85,.12)':'rgba(255,255,255,.065)';transitionSwell();curtain.classList.add('on');setTimeout(()=>{index=Math.max(0,Math.min(nextIndex,scenes.length-1));scenes[index].scrollIntoView({behavior:'auto',block:'start'});setTimeout(()=>{curtain.classList.remove('on');transitioning=false;if(fromAuto&&playing)schedule()},340)},820)}function schedule(){clearTimeout(timer);if(!playing||!started||!scenes.length)return;if(index>=scenes.length-1){playBtn.textContent='↻';playBtn.setAttribute('aria-label','Replay journey');return}timer=setTimeout(()=>showCurtain(index+1,true),getDwell(scenes[index]))}function manualTakeover(){if(!started||transitioning)return;playing=false;clearTimeout(timer);playBtn.textContent='▶';playBtn.setAttribute('aria-label','Resume autoplay');clearTimeout(manualPauseTimer);manualPauseTimer=setTimeout(()=>{hint.innerHTML='<b>Journey paused</b> · press ▶ to continue automatically'},1000)}function detectCurrent(){if(!scenes.length||!win)return;let best=0,dist=Infinity;scenes.forEach((s,i)=>{const d=Math.abs(s.getBoundingClientRect().top);if(d<dist){dist=d;best=i}});index=best}launchBtn.addEventListener('click',()=>{setupFrame();ensureAudio();if(audio&&audio.state==='suspended')audio.resume();introMusic();started=true;playing=true;setTimeout(()=>{launch.classList.add('hide');controls.classList.add('show');hint.classList.add('show');scheduleMusic();setTimeout(()=>{if(scenes.length){index=0;scenes[0].scrollIntoView({behavior:'auto',block:'start'});schedule()}},760)},1350)});playBtn.addEventListener('click',()=>{if(!started)return;if(playBtn.textContent==='↻'){index=0;playing=true;playBtn.textContent='Ⅱ';showCurtain(0,false);setTimeout(schedule,1750);return}playing=!playing;playBtn.textContent=playing?'Ⅱ':'▶';playBtn.setAttribute('aria-label',playing?'Pause autoplay':'Resume autoplay');if(playing){detectCurrent();hint.innerHTML='<b>Auto journey</b> · scroll anytime to take control';schedule()}else clearTimeout(timer)});soundBtn.addEventListener('click',()=>{soundOn=!soundOn;soundBtn.classList.toggle('playing',soundOn);soundBtn.setAttribute('aria-label',soundOn?'Mute soundtrack':'Enable soundtrack');if(soundOn){ensureAudio();if(audio&&audio.state==='suspended')audio.resume();scheduleMusic()}else{clearTimeout(musicTimer)}});setInterval(()=>{if(started&&!transitioning)detectCurrent()},800);if(reduce){playing=false;soundOn=false;playBtn.textContent='▶';soundBtn.classList.remove('playing')}})();</script></body></html>
