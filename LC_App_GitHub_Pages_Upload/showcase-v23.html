<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LC — Cinematic Journey V23</title><meta name="description" content="LC is a social discovery and return layer for Live Casino, built around people."><style>:root{--mint:#59e8c7;--mint2:#c9fff4;--ease:cubic-bezier(.16,1,.3,1);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010202}.stage,.stage iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#020303}.launch{position:fixed;inset:0;z-index:900;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,rgba(89,232,199,.09),transparent 30%),#010202;transition:opacity .95s var(--ease),visibility .95s}.launch.hide{opacity:0;visibility:hidden;pointer-events:none}.launchInner{text-align:center;width:min(90vw,680px)}.appButton{width:164px;height:164px;border:0;background:none;padding:0;cursor:pointer;position:relative;border-radius:38px;filter:drop-shadow(0 28px 80px rgba(0,0,0,.72));transition:transform .5s var(--ease)}.appButton:hover{transform:scale(1.045)}.appButton img{width:100%;height:100%;border-radius:36px}.pulse{position:absolute;inset:-24px;border:1px solid rgba(201,255,244,.15);border-radius:54px;animation:pulse 3.4s ease-in-out infinite}.pulse:before{content:"";position:absolute;inset:-18px;border:1px solid rgba(89,232,199,.05);border-radius:66px}@keyframes pulse{50%{transform:scale(1.025);opacity:.45}}.launch h1{font-size:clamp(42px,6vw,80px);line-height:.92;letter-spacing:-.065em;margin:46px 0 14px;color:#f6fbf9}.launch h1 span{color:var(--mint2)}.launch p{margin:auto;color:#aebdb8;font-size:16px;line-height:1.65}.begin{margin-top:28px;color:var(--mint);font-size:11px;font-weight:850;letter-spacing:.22em;text-transform:uppercase}.curtain{position:fixed;inset:0;z-index:700;background:#000;opacity:0;pointer-events:none;transition:opacity .56s ease;display:grid;place-items:center}.curtain.on{opacity:1}.mark{width:min(52vw,330px);height:1px;background:linear-gradient(90deg,transparent,rgba(89,232,199,.34),transparent);transform:scaleX(.25);opacity:0;transition:.55s var(--ease)}.curtain.on .mark{transform:scaleX(1);opacity:1}.ambient{position:fixed;inset:0;z-index:605;pointer-events:none;overflow:hidden}.card{position:absolute;width:92px;height:132px;border:1px solid rgba(255,255,255,.035);border-radius:16px;opacity:.6}.card:after{position:absolute;inset:10px;font-family:Georgia,serif;font-size:24px;color:rgba(255,255,255,.055)}.c1{left:-28px;top:18%;transform:rotate(-13deg)}.c1:after{content:'♠'}.c2{right:-25px;top:33%;transform:rotate(11deg)}.c2:after{content:'♦';color:rgba(179,75,85,.07)}.c3{left:5%;bottom:-42px;transform:rotate(7deg)}.c3:after{content:'♣'}.c4{right:6%;bottom:-46px;transform:rotate(-8deg)}.c4:after{content:'♥';color:rgba(179,75,85,.07)}.controls{position:fixed;right:18px;bottom:18px;z-index:760;display:flex;gap:8px;opacity:0;transform:translateY(10px);transition:.5s var(--ease)}.controls.show{opacity:1;transform:none}.control{width:42px;height:42px;border:1px solid rgba(255,255,255,.1);background:rgba(2,4,4,.72);color:#dce7e3;border-radius:50%;display:grid;place-items:center;cursor:pointer;font-weight:850}.hint{position:fixed;left:18px;bottom:20px;z-index:760;color:rgba(255,255,255,.34);font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:0;transition:.5s}.hint.show{opacity:1}.hint b{color:var(--mint)}@media(max-width:650px){.appButton{width:124px;height:124px}.appButton img{border-radius:28px}.launch h1{font-size:44px}.launch p{font-size:14px;max-width:88%}.controls{right:12px;bottom:12px}.hint{left:12px;bottom:16px;max-width:55vw;line-height:1.4}.card{width:64px;height:92px}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}.launch,.curtain,.mark,.controls{transition:none}.ambient{display:none}}</style></head><body><div class="stage"><iframe id="story" src="showcase-v19.html" title="LC product journey"></iframe></div><div class="ambient" aria-hidden="true"><i class="card c1"></i><i class="card c2"></i><i class="card c3"></i><i class="card c4"></i></div><div class="curtain" id="curtain"><div class="mark"></div></div><div class="launch" id="launch"><div class="launchInner"><button class="appButton" id="launchBtn" aria-label="Begin LC journey"><span class="pulse"></span><img src="app-icon.svg" alt="LC App icon"></button><h1>Live Casino <span>through people.</span></h1><p>A guided product story. Tap the icon and let the journey unfold.</p><div class="begin">Tap the icon to begin</div></div></div><div class="controls" id="controls"><button class="control" id="playBtn" aria-label="Pause autoplay">Ⅱ</button></div><div class="hint" id="hint"><b>Auto journey</b> · scroll anytime to take control</div><script>(()=>{const f=document.getElementById('story'),launch=document.getElementById('launch'),btn=document.getElementById('launchBtn'),curtain=document.getElementById('curtain'),controls=document.getElementById('controls'),playBtn=document.getElementById('playBtn'),hint=document.getElementById('hint'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let d,w,scenes=[],i=0,started=false,playing=!reduce,timer,transitioning=false;const dwell={hero:5600,why:3400,shift:5000,people:6200,loop:6200,proof:6800,value:6000,money:8500,fit:7200,final:9000};function setup(){try{d=f.contentDocument;w=f.contentWindow;if(!d)return;const s=d.getElementById('start');if(s)s.classList.add('hidden');d.body.classList.remove('locked');scenes=[...d.querySelectorAll('.scene')];d.documentElement.style.scrollSnapType='y mandatory';const st=d.createElement('style');st.textContent=`.scene{scroll-snap-stop:always}.moneySplit{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:34px}.moneyLane{border:1px solid rgba(255,255,255,.09);border-radius:28px;padding:27px;background:linear-gradient(180deg,rgba(89,232,199,.035),rgba(255,255,255,.008))}.moneyLane small{color:#59e8c7;font-weight:900;letter-spacing:.14em}.moneyLane h3{font-size:clamp(29px,3vw,45px);line-height:1.02;letter-spacing:-.045em;margin:12px 0 20px}.valueFlow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0 22px}.valueFlow span{border:1px solid rgba(255,255,255,.09);border-radius:999px;padding:8px 11px;color:#cbd6d2;font-size:11px}.valueFlow i{font-style:normal;color:#59e8c7}.moneyRow{padding:15px 0;border-top:1px solid rgba(255,255,255,.075)}.moneyRow b{display:block;font-size:16px;margin-bottom:5px}.moneyRow p{margin:0;color:#87938f;font-size:13px;line-height:1.5}.moneyModel{margin-top:7px!important;color:#c9fff4!important;font-size:12px!important}.moneyBridge{margin-top:22px;padding:20px 22px;border:1px solid rgba(89,232,199,.18);border-radius:22px;background:rgba(89,232,199,.035);font-size:clamp(18px,1.8vw,25px);line-height:1.3}.moneyNote{margin-top:15px;color:#73807c;font-size:11px;line-height:1.5}@media(max-width:850px){.moneySplit{grid-template-columns:1fr}.moneyLane{padding:22px}.valueFlow{gap:6px}.valueFlow span{font-size:10px;padding:7px 9px}}`;d.head.appendChild(st);money();w.addEventListener('wheel',pause,{passive:true});w.addEventListener('touchstart',pause,{passive:true})}catch(e){console.warn(e)}}f.addEventListener('load',setup);function money(){const s=d&&d.getElementById('money'),x=s&&s.querySelector('.wrap');if(!x)return;x.innerHTML=`<div class="eyebrow" data-en="Commercial value" data-ru="Коммерческая ценность">Commercial value</div><h2 class="title" data-en="Two partners. Two clear reasons to pay." data-ru="Два типа партнёров. Две понятные причины платить LC.">Two partners. Two clear reasons to pay.</h2><p class="lead" data-en="LC can monetize the layer between human discovery and the licensed gaming experience — without replacing either operator or provider." data-ru="LC может монетизировать слой между discovery через человека и лицензированной игрой — не заменяя ни оператора, ни провайдера.">LC can monetize the layer between human discovery and the licensed gaming experience — without replacing either operator or provider.</p><div class="moneySplit"><article class="moneyLane"><small>OPERATOR</small><h3 data-en="More reasons for a player to enter — and come back." data-ru="Больше поводов игроку прийти — и вернуться.">More reasons for a player to enter — and come back.</h3><div class="valueFlow"><span>Discover creator</span><i>→</i><span>Operator handoff</span><i>→</i><span>Play</span><i>→</i><span>Follow / Live</span><i>→</i><span>Return</span></div><div class="moneyRow"><b data-en="Pay for access" data-ru="Платить за доступ">Pay for access</b><p data-en="Use LC as a social discovery and return channel around the operator's Live Casino." data-ru="Использовать LC как социальный канал discovery и возврата вокруг Live Casino оператора.">Use LC as a social discovery and return channel around the operator's Live Casino.</p><p class="moneyModel" data-en="Possible: platform / service fee" data-ru="Возможная модель: platform / service fee">Possible: platform / service fee</p></div><div class="moneyRow"><b data-en="Pay for attributable value" data-ru="Платить за измеримый результат">Pay for attributable value</b><p data-en="Where attribution is agreed, LC can participate in value generated by referred or returning players." data-ru="Если атрибуция согласована, LC может участвовать в ценности от приведённых или вернувшихся игроков.">Where attribution is agreed, LC can participate in value generated by referred or returning players.</p><p class="moneyModel" data-en="Possible: performance / revenue participation" data-ru="Возможная модель: performance / revenue participation">Possible: performance / revenue participation</p></div><div class="moneyRow"><b data-en="Share creator-economy activity" data-ru="Участвовать в creator economy">Share creator-economy activity</b><p data-en="Subscriptions, tips and branded activity can create additional non-core-gaming revenue around creator relationships." data-ru="Подписки, чаевые и бренд-активации могут создавать дополнительную выручку вокруг отношений игрока и creator-персоны.">Subscriptions, tips and branded activity can create additional non-core-gaming revenue around creator relationships.</p></div></article><article class="moneyLane"><small>PROVIDER</small><h3 data-en="Turn dealers and hosts into a distribution surface for content." data-ru="Превратить дилеров и ведущих в новый канал дистрибуции контента.">Turn dealers and hosts into a distribution surface for content.</h3><div class="valueFlow"><span>Creator identity</span><i>→</i><span>Discovery</span><i>→</i><span>Table / format</span><i>→</i><span>Operator</span><i>→</i><span>Play</span></div><div class="moneyRow"><b data-en="Pay for distribution access" data-ru="Платить за дистрибуцию">Pay for distribution access</b><p data-en="LC can give existing tables, formats and dealer talent an additional people-led discovery surface." data-ru="LC может дать существующим столам, форматам и дилерам дополнительную people-led точку discovery.">LC can give existing tables, formats and dealer talent an additional people-led discovery surface.</p><p class="moneyModel" data-en="Possible: platform / distribution fee" data-ru="Возможная модель: platform / distribution fee">Possible: platform / distribution fee</p></div><div class="moneyRow"><b data-en="Pay for launches & campaigns" data-ru="Платить за запуски и кампании">Pay for launches & campaigns</b><p data-en="New tables, game formats or branded experiences can be activated through relevant creators." data-ru="Новые столы, форматы или брендированные продукты можно продвигать через релевантных creator-персон.">New tables, game formats or branded experiences can be activated through relevant creators.</p><p class="moneyModel" data-en="Possible: campaign / sponsorship fee" data-ru="Возможная модель: campaign / sponsorship fee">Possible: campaign / sponsorship fee</p></div><div class="moneyRow"><b data-en="Share measurable distribution value" data-ru="Делиться измеримой ценностью дистрибуции">Share measurable distribution value</b><p data-en="Where a provider and its operator network can attribute traffic or activity, commercial participation can follow performance." data-ru="Если провайдер и его операторская сеть могут атрибутировать трафик или активность, коммерческая модель может зависеть от результата.">Where a provider and its operator network can attribute traffic or activity, commercial participation can follow performance.</p></div></article></div><div class="moneyBridge" data-en="LC monetizes discovery, distribution and relationships around licensed gaming — not the regulated gaming activity itself." data-ru="LC монетизирует discovery, дистрибуцию и отношения вокруг лицензированной игры — а не саму регулируемую игровую деятельность.">LC monetizes discovery, distribution and relationships around licensed gaming — not the regulated gaming activity itself.</div><div class="moneyNote" data-en="Illustrative commercial directions only. Pricing, attribution rules and partner economics remain to be validated." data-ru="Это возможные направления бизнес-модели. Цены, правила атрибуции и экономика партнёров ещё должны быть подтверждены.">Illustrative commercial directions only. Pricing, attribution rules and partner economics remain to be validated.</div>`;const lang=d.documentElement.lang==='ru'?'ru':'en';x.querySelectorAll('[data-en]').forEach(n=>n.innerHTML=n.dataset[lang])}function schedule(){clearTimeout(timer);if(!started||!playing||!scenes.length||i>=scenes.length-1)return;timer=setTimeout(()=>go(i+1),dwell[scenes[i].id]||5600)}function go(n){if(transitioning)return;transitioning=true;clearTimeout(timer);curtain.classList.add('on');setTimeout(()=>{i=Math.max(0,Math.min(n,scenes.length-1));scenes[i].scrollIntoView({behavior:'auto',block:'start'});setTimeout(()=>{curtain.classList.remove('on');transitioning=false;if(i>=scenes.length-1){playBtn.textContent='↻'}else schedule()},220)},560)}function pause(){if(!started||transitioning)return;playing=false;clearTimeout(timer);playBtn.textContent='▶';hint.innerHTML='<b>Journey paused</b> · press ▶ to continue'}btn.addEventListener('click',()=>{setup();started=true;playing=!reduce;launch.classList.add('hide');controls.classList.add('show');hint.classList.add('show');setTimeout(()=>{if(scenes.length){i=0;scenes[0].scrollIntoView({behavior:'auto',block:'start'});schedule()}},720)});playBtn.addEventListener('click',()=>{if(playBtn.textContent==='↻'){i=0;playing=true;playBtn.textContent='Ⅱ';go(0);return}playing=!playing;playBtn.textContent=playing?'Ⅱ':'▶';if(playing){hint.innerHTML='<b>Auto journey</b> · scroll anytime to take control';schedule()}else clearTimeout(timer)})})();</script></body></html>
