ntro';money.innerHTML=`<div class="lcWrap"><div class="lcEyebrow" data-en="Commercial logic" data-ru="Коммерческая логика">Commercial logic</div><h2 class="lcTitle" data-en="LC creates value around discovery, distribution and return." data-ru="LC создаёт ценность вокруг поиска, дистрибуции и возврата.">LC creates value around discovery, distribution and return.</h2><p class="lcLead" data-en="The licensed game stays where it is. LC adds a people-led layer before play and a relationship layer after it." data-ru="Лицензированная игра остаётся там, где она уже работает. LC добавляет путь через человека до игры и связь после неё.">The licensed game stays where it is. LC adds a people-led layer before play and a relationship layer after it.</p><div class="lcFlow"><span data-en="Creator attention" data-ru="Внимание к креатору">Creator attention</span><i>→</i><span data-en="Discovery" data-ru="Поиск">Discovery</span><i>→</i><span data-en="Licensed handoff" data-ru="Переход к оператору">Licensed handoff</span><i>→</i><span data-en="Play" data-ru="Игра">Play</span><i>→</i><span data-en="Follow / Live" data-ru="Подписка / эфир">Follow / Live</span><i>→</i><span data-en="Return" data-ru="Возврат">Return</span></div><div class="lcThesis"><b data-en="Where LC can participate" data-ru="Где может зарабатывать LC">Where LC can participate</b><p data-en="Access and service fees, activation campaigns, attributable performance economics and eligible creator-economy activity — only where the model is measurable, contractually agreed and permitted by market requirements." data-ru="Плата за доступ и сервис, кампании по активации, вознаграждение за измеримый результат и допустимая creator-economy активность — только там, где модель измерима, согласована договором и соответствует требованиям рынка.">Access and service fees, activation campaigns, attributable performance economics and eligible creator-economy activity — only where the model is measurable, contractually agreed and permitted by market requirements.</p></div></div>`;const op=d.createElement('section');op.id='money-operator';op.className='scene lcCommercial';op.innerHTML=`<div class="lcWrap"><div class="lcEyebrow">OPERATOR</div><h2 class="lcTitle" data-en="Acquire through people. Return through relationships." data-ru="Привлекать через людей. Возвращать через отношения.">Acquire through people. Return through relationships.</h2><p class="lcLead" data-en="LC can add a human reason to choose an operator and a human reason to come back." data-ru="LC может дать игроку человеческий повод выбрать оператора и человеческий повод вернуться.">LC can add a human reason to choose an operator and a human reason to come back.</p><div class="lcRows"><article><span>01</span><div><b data-en="Discovery & acquisition" data-ru="Поиск и привлечение">Discovery & acquisition</b><p data-en="A player discovers Sofia in LC and moves through a clear handoff into the operator's licensed environment." data-ru="Игрок находит Софию в LC и по понятному переходу попадает в лицензированную среду оператора.">A player discovers Sofia in LC and moves through a clear handoff into the operator's licensed environment.</p><small data-en="Possible LC economics: access/service fee, campaign fee, or agreed acquisition economics where permitted." data-ru="Возможная экономика LC: плата за доступ или сервис, плата за кампанию либо согласованная модель привлечения там, где она допустима.">Possible LC economics: access/service fee, campaign fee, or agreed acquisition economics where permitted.</small></div></article><article><span>02</span><div><b data-en="Return & retention" data-ru="Возврат и удержание">Return & retention</b><p data-en="Follow, live status and schedule create a specific reason to return that begins with a person rather than a generic promotion." data-ru="Подписка, статус эфира и расписание дают конкретный повод вернуться, который начинается с человека, а не с общей промо-акции.">Follow, live status and schedule create a specific reason to return that begins with a person rather than a generic promotion.</p><small data-en="Possible LC economics: service fee or agreed participation in attributable return activity." data-ru="Возможная экономика LC: плата за сервис или согласованное вознаграждение за атрибутируемые возвраты.">Possible LC economics: service fee or agreed participation in attributable return activity.</small></div></article><article><span>03</span><div><b data-en="Creator-led monetization" data-ru="Монетизация вокруг креатора">Creator-led monetization</b><p data-en="Possible future formats such as subscriptions, tips or brand activity can monetize the relationship without moving the regulated game into LC." data-ru="Возможные будущие форматы, например подписки, чаевые или бренд-активности, могут монетизировать отношения без переноса регулируемой игры в LC.">Possible future formats such as subscriptions, tips or brand activity can monetize the relationship without moving the regulated game into LC.</p><small data-en="Possible LC economics: an agreed share of eligible creator-economy activity, subject to partner and market rules." data-ru="Возможная экономика LC: согласованная доля от допустимой creator-economy активности с учётом правил партнёра и рынка.">Possible LC economics: an agreed share of eligible creator-economy activity, subject to partner and market rules.</small></div></article></div><div class="lcExample"><b data-en="Example journey" data-ru="Пример пути">Example journey</b><p data-en="Find Sofia → enter Operator → follow Sofia → see that she is live → return → attribution identifies the LC source → the agreed commercial rule applies." data-ru="Найти Софию → перейти к оператору → подписаться на Софию → увидеть, что она в эфире → вернуться → атрибуция фиксирует источник LC → применяется заранее согласованная коммерческая модель.">Find Sofia → enter Operator → follow Sofia → see that she is live → return → attribution identifies the LC source → the agreed commercial rule applies.</p></div></div>`;const pr=d.createElement('section');pr.id='money-provider';pr.className='scene lcCommercial';pr.innerHTML=`<div class="lcWrap"><div class="lcEyebrow">PROVIDER</div><h2 class="lcTitle" data-en="Give existing Live Casino content a people-led distribution layer." data-ru="Добавить существующему Live Casino контенту дистрибуцию через людей.">Give existing Live Casino content a people-led distribution layer.</h2><p class="lcLead" data-en="A dealer or host can become the doorway into a table, format or studio concept that would otherwise depend mainly on lobby placement." data-ru="Дилер или ведущий может стать входом в стол, формат или студийную концепцию, которые иначе в основном зависят от размещения в лобби.">A dealer or host can become the doorway into a table, format or studio concept that would otherwise depend mainly on lobby placement.</p><div class="lcRows"><article><span>01</span><div><b data-en="Distribution access" data-ru="Дополнительный канал дистрибуции">Distribution access</b><p data-en="Persistent creator identities give existing tables and formats another discovery surface without rebuilding the game." data-ru="Постоянные профили креаторов дают существующим столам и форматам ещё одну точку входа без перестройки самой игры.">Persistent creator identities give existing tables and formats another discovery surface without rebuilding the game.</p><small data-en="Possible LC economics: platform or distribution access fee." data-ru="Возможная экономика LC: плата за доступ к платформе или каналу дистрибуции.">Possible LC economics: platform or distribution access fee.</small></div></article><article><span>02</span><div><b data-en="Launch & activation" data-ru="Запуск и активация">Launch & activation</b><p data-en="A relevant creator can introduce a new table, format or branded activation to an audience already interested in that person." data-ru="Релевантный креатор может представить новый стол, формат или бренд-активацию аудитории, которой уже интересен этот человек.">A relevant creator can introduce a new table, format or branded activation to an audience already interested in that person.</p><small data-en="Possible LC economics: campaign or activation fee, subject to partner and market requirements." data-ru="Возможная экономика LC: плата за кампанию или активацию с учётом требований партнёра и рынка.">Possible LC economics: campaign or activation fee, subject to partner and market requirements.</small></div></article><article><span>03</span><div><b data-en="Measurable content performance" data-ru="Измеримая эффективность контента">Measurable content performance</b><p data-en="If provider, operator and LC agree attribution, discovery and handoff activity can be tied to creators, tables or campaigns." data-ru="Если провайдер, оператор и LC согласуют атрибуцию, поиск и переходы можно связать с конкретными креаторами, столами или кампаниями.">If provider, operator and LC agree attribution, discovery and handoff activity can be tied to creators, tables or campaigns.</p><small data-en="Possible LC economics: agreed performance participation where measurable and contractually permitted." data-ru="Возможная экономика LC: согласованное вознаграждение за измеримый результат, если это допускается договором.">Possible LC economics: agreed performance participation where measurable and contractually permitted.</small></div></article></div><div class="lcExample"><b data-en="Example journey" data-ru="Пример пути">Example journey</b><p data-en="Provider launches a table with Sofia → LC surfaces Sofia and the table → player hands off through the licensed operator → activity is attributed → the agreed activation or performance rule applies." data-ru="Провайдер запускает стол с Софией → LC показывает Софию и стол → игрок переходит через лицензированного оператора → активность атрибутируется → применяется согласованная модель активации или результата.">Provider launches a table with Sofia → LC surf
