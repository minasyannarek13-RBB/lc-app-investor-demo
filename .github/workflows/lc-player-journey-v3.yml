              css_path.write_text(css, encoding='utf-8')

          sw = sw_path.read_text(encoding='utf-8')
          sw = re.sub(r'lc-app-investor-demo-v\d+', 'lc-app-investor-demo-v94', sw, count=1)
          sw_path.write_text(sw, encoding='utf-8')
          PY

      - name: Syntax and product contract checks
        run: |
          set -euo pipefail
          node --check LC_App_GitHub_Pages_Upload/app-product.js
          node --check LC_App_GitHub_Pages_Upload/product-shell-v2.js
          node --check LC_App_GitHub_Pages_Upload/auth.js
          node --check LC_App_GitHub_Pages_Upload/sw.js
          python3 - <<'PY'
          from pathlib import Path
          js = Path('LC_App_GitHub_Pages_Upload/app-product.js').read_text(encoding='utf-8')
          css = Path('LC_App_GitHub_Pages_Upload/product-shell-v2.css').read_text(encoding='utf-8')
          sw = Path('LC_App_GitHub_Pages_Upload/sw.js').read_text(encoding='utf-8')
          required = [
              'Who do you want to come back for?',
              'People you can join now',
              'Creators worth following',
              'Why follow ${safe(profileName(item.profile))}',
              'Keep the person, not just the table.',
              'You are leaving LC App to play.',
              'Your LC App experience'
          ]
          for marker in required:
              assert marker in js, marker
          assert 'LC PLAYER JOURNEY V3' in css
          assert 'lc-app-investor-demo-v94' in sw
          assert 'service_role' not in js.lower()
          assert 'wallet · kyc/aml · wagering · settlement' in js.lower()
          print('LC Player journey v3 contract: PASS')
          PY
          git diff --check

      - name: Verify protected public showcase unchanged
        run: |
          git diff --exit-code -- CNAME showcase-v2 || {
            echo 'Protected showcase/domain files changed unexpectedly.' >&2
            exit 1
          }

      - name: Commit verified Player journey
        run: |
          git config user.name 'LC App Build Engine'
          git config user.email 'actions@users.noreply.github.com'
          git add LC_App_GitHub_Pages_Upload/app-product.js LC_App_GitHub_Pages_Upload/product-shell-v2.css LC_App_GitHub_Pages_Upload/sw.js
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'Rebuild LC App Player journey v3'
          git push origin HEAD:main
