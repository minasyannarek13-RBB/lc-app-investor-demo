name: Reveal Sales Integrate Industry

on:
  push:
    branches:
      - reveal-sales-v1
    paths:
      - '.github/workflows/reveal-sales-integrate-industry.yml'

jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: reveal-sales-v1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch Industry route
        run: node scripts/integrate-reveal-sales.js
      - name: Syntax and content checks
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('showcase-v2/index.html','utf8');
          const script = html.match(/<script>([\s\S]*)<\/script>/)?.[1];
          if (!script) throw new Error('script block missing');
          fs.writeFileSync('/tmp/lc-reveal-script.js', script);
          NODE
          node --check /tmp/lc-reveal-script.js
          grep -q 'Why should an operator care?' showcase-v2/index.html
          grep -q 'Potential to change Live Casino operating economics.' showcase-v2/index.html
          grep -q 'The dealer should not disappear when the shift ends.' showcase-v2/index.html
          grep -q 'OPEN BUSINESS & MONETIZATION' showcase-v2/index.html
      - name: Commit verified branch-only integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add showcase-v2/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Integrate operator provider sales story into Industry route'
          git push origin HEAD:reveal-sales-v1
