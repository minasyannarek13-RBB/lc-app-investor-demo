name: Reveal v3 patch

on:
  push:
    branches:
      - reveal-director-polish

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[reveal-v3-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reveal-director-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply reveal v3 patch
        run: node tools/reveal-v3-patch.mjs
      - name: Verify syntax
        run: |
          node --check app-product.js
          node --check LC_App_GitHub_Pages_Upload/app-product.js
      - name: Commit patched reveal
        run: |
          if git diff --quiet; then
            echo "No reveal changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-product.js LC_App_GitHub_Pages_Upload/app-product.js
          git commit -m "Apply reveal v3 narrative polish [reveal-v3-applied]"
          git push origin HEAD:reveal-director-polish
